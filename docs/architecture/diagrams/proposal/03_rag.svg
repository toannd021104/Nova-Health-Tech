<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <style>
      .box  { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.2; rx:8; ry:8; }
      .svc  { fill:#eff6ff; stroke:#60a5fa; }
      .data { fill:#fefce8; stroke:#facc15; }
      .em   { fill:#fef2f2; stroke:#dc2626; stroke-width:1.5; }
      .cp   { fill:#ecfdf5; stroke:#16a34a; stroke-width:1.5; }
      .grp  { fill:#f8fafc; stroke:#94a3b8; stroke-dasharray:4 3; rx:12; ry:12; }
      .ttl  { font-weight:700; }
      .sm   { fill:#64748b; font-size:10.5px; }
      .edge { stroke:#64748b; stroke-width:1.3; fill:none; }
      .edge-em { stroke:#dc2626; stroke-width:1.8; fill:none; }
      .edge-cp { stroke:#16a34a; stroke-width:1.8; fill:none; }
    </style>
  </defs>

  <text x="640" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">
    RAG architecture — hybrid retrieval · rerank · GraphRAG · citation
  </text>
  <text x="640" y="44" text-anchor="middle" font-size="12" fill="#64748b">
    Two retrieval lanes: Emergency (one-pass hybrid) · Complex (agentic tool-calling + graph traversal)
  </text>

  <!-- Query entry -->
  <rect x="20" y="80" width="230" height="120" class="box svc"/>
  <text x="135" y="100" text-anchor="middle" class="ttl">Query pre-processing</text>
  <text x="135" y="118" text-anchor="middle" class="sm">1. PHI mask (Comprehend Medical)</text>
  <text x="135" y="134" text-anchor="middle" class="sm">2. ICD-11 silent query expansion</text>
  <text x="135" y="150" text-anchor="middle" class="sm">3. Metadata pre-filter</text>
  <text x="135" y="166" text-anchor="middle" class="sm">  (specialty · recency · grade)</text>
  <text x="135" y="184" text-anchor="middle" class="sm">4. Semantic cache check (L1)</text>

  <!-- Emergency lane -->
  <rect x="290" y="80" width="440" height="200" class="grp"/>
  <text x="300" y="102" class="ttl">Emergency lane — one-pass hybrid (≤ 2 s p95)</text>

  <rect x="300" y="120" width="200" height="60" class="box em"/>
  <text x="400" y="140" text-anchor="middle" class="ttl">BM25 + kNN HNSW</text>
  <text x="400" y="156" text-anchor="middle" class="sm">OpenSearch Serverless (SG)</text>
  <text x="400" y="172" text-anchor="middle" class="sm">top-20 candidates</text>

  <rect x="520" y="120" width="200" height="60" class="box em"/>
  <text x="620" y="140" text-anchor="middle" class="ttl">Amazon Rerank 1.0</text>
  <text x="620" y="156" text-anchor="middle" class="sm">Tokyo ap-northeast-1</text>
  <text x="620" y="172" text-anchor="middle" class="sm">top-20 → top-5</text>

  <rect x="300" y="200" width="420" height="60" class="box em"/>
  <text x="510" y="220" text-anchor="middle" class="ttl">Emergency agent (Haiku 4.5 / Nova Micro)</text>
  <text x="510" y="236" text-anchor="middle" class="sm">grounded-only prompt · citation required · fixed system prefix</text>
  <text x="510" y="252" text-anchor="middle" class="sm">Bedrock Prompt Caching hit on prefix</text>

  <!-- Complex lane -->
  <rect x="290" y="300" width="440" height="320" class="grp"/>
  <text x="300" y="322" class="ttl">Complex lane — agentic (≤ 6 s p95)</text>

  <rect x="300" y="340" width="420" height="60" class="box cp"/>
  <text x="510" y="360" text-anchor="middle" class="ttl">Router agent (Nova Micro, JSON mode)</text>
  <text x="510" y="376" text-anchor="middle" class="sm">picks 1-of-40 specialty agents · confidence threshold 0.6</text>
  <text x="510" y="392" text-anchor="middle" class="sm">&lt; 0.6 → General Medicine / Triage with banner</text>

  <rect x="300" y="410" width="200" height="60" class="box cp"/>
  <text x="400" y="430" text-anchor="middle" class="ttl">Specialty agent</text>
  <text x="400" y="446" text-anchor="middle" class="sm">Claude Sonnet 4.5</text>
  <text x="400" y="462" text-anchor="middle" class="sm">or Nova Pro (A1+)</text>

  <rect x="520" y="410" width="200" height="60" class="box cp"/>
  <text x="620" y="430" text-anchor="middle" class="ttl">Side-channel agents</text>
  <text x="620" y="446" text-anchor="middle" class="sm">Clinical Pharmacy (auto)</text>
  <text x="620" y="462" text-anchor="middle" class="sm">Radiology (if image)</text>

  <rect x="300" y="480" width="420" height="130" class="box cp"/>
  <text x="510" y="500" text-anchor="middle" class="ttl">Agent tools (Bedrock action groups · read-only)</text>
  <text x="510" y="518" text-anchor="middle" class="sm">kb_retrieve(topic, source, max_age)</text>
  <text x="510" y="534" text-anchor="middle" class="sm">graph_retrieve(entity, relation, hops) — Neptune Analytics GraphRAG</text>
  <text x="510" y="550" text-anchor="middle" class="sm">icd11_lookup(term, mode) — live WHO API</text>
  <text x="510" y="566" text-anchor="middle" class="sm">pubmed_search(query, n) — NCBI E-utilities</text>
  <text x="510" y="582" text-anchor="middle" class="sm">retrieve_trial(doc_id) — internal KB with PHI tokens</text>
  <text x="510" y="600" text-anchor="middle" class="sm">icd11_expand_query(term) — silent recall boost</text>

  <!-- Post-processing -->
  <rect x="770" y="80" width="490" height="540" class="grp"/>
  <text x="780" y="102" class="ttl">Post-processing · validation · response</text>

  <rect x="780" y="120" width="470" height="70" class="box svc"/>
  <text x="1015" y="140" text-anchor="middle" class="ttl">Bedrock Guardrails</text>
  <text x="1015" y="158" text-anchor="middle" class="sm">denied topics: self-diagnosis · dosing override · illegal synthesis</text>
  <text x="1015" y="174" text-anchor="middle" class="sm">grounding score ≥ 0.7 · prompt-injection filter · PHI filter</text>

  <rect x="780" y="200" width="470" height="70" class="box svc"/>
  <text x="1015" y="220" text-anchor="middle" class="ttl">Citation validator (custom Lambda)</text>
  <text x="1015" y="238" text-anchor="middle" class="sm">every cited chunk resolvable · URL / doc_id / section / page</text>
  <text x="1015" y="254" text-anchor="middle" class="sm">rejects answer if unsupported · triggers rerun with narrower retrieval</text>

  <rect x="780" y="280" width="470" height="60" class="box svc"/>
  <text x="1015" y="300" text-anchor="middle" class="ttl">Source traceability record</text>
  <text x="1015" y="318" text-anchor="middle" class="sm">DynamoDB chat_trace: session · query · chunks · model · ms</text>

  <rect x="780" y="350" width="470" height="60" class="box svc"/>
  <text x="1015" y="370" text-anchor="middle" class="ttl">Response streaming (Converse API)</text>
  <text x="1015" y="388" text-anchor="middle" class="sm">TTFT ~300–400 ms · Markdown + DOMPurify client-side</text>

  <rect x="780" y="410" width="470" height="60" class="box data"/>
  <text x="1015" y="430" text-anchor="middle" class="ttl">Semantic cache populate (L1)</text>
  <text x="1015" y="448" text-anchor="middle" class="sm">ElastiCache Redis OSS · ~30–45% hit rate observed</text>

  <rect x="780" y="470" width="470" height="60" class="box data"/>
  <text x="1015" y="490" text-anchor="middle" class="ttl">Knowledge freshness &amp; versioning</text>
  <text x="1015" y="508" text-anchor="middle" class="sm">each chunk has revision · stale-doc banner if review_date expired</text>

  <rect x="780" y="540" width="470" height="70" class="box data"/>
  <text x="1015" y="560" text-anchor="middle" class="ttl">Why RAG + targeted fine-tune, not fine-tune alone</text>
  <text x="1015" y="578" text-anchor="middle" class="sm">RAG = freshness + citation + safety (WHO monthly refresh)</text>
  <text x="1015" y="594" text-anchor="middle" class="sm">Fine-tune only for tone / phrasing / clinical vocabulary (not facts)</text>

  <!-- Edges -->
  <path d="M245 140 L290 140" class="edge-em" marker-end="url(#a)"/>
  <path d="M245 160 L290 360" class="edge-cp" marker-end="url(#ag)"/>
  <path d="M500 150 L520 150" class="edge" marker-end="url(#a)"/>
  <path d="M620 180 L510 200" class="edge-em" marker-end="url(#a)"/>
  <path d="M510 400 L400 410" class="edge-cp" marker-end="url(#ag)"/>
  <path d="M510 400 L620 410" class="edge-cp" marker-end="url(#ag)"/>
  <path d="M400 470 L510 480" class="edge-cp" marker-end="url(#ag)"/>
  <path d="M720 230 L780 155" class="edge-em" marker-end="url(#a)"/>
  <path d="M720 540 L780 155" class="edge-cp" marker-end="url(#ag)"/>
</svg>
