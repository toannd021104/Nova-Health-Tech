<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .box  { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.2; rx:8; ry:8; }
      .svc  { fill:#eff6ff; stroke:#60a5fa; }
      .data { fill:#fefce8; stroke:#facc15; }
      .aws  { fill:#fff7ed; stroke:#fb923c; }
      .grp  { fill:#f8fafc; stroke:#94a3b8; stroke-dasharray:4 3; rx:12; ry:12; }
      .ttl  { font-weight:700; }
      .sm   { fill:#64748b; font-size:10.5px; }
      .edge { stroke:#64748b; stroke-width:1.3; fill:none; }
    </style>
  </defs>

  <text x="640" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">
    Observability &amp; compliance monitoring
  </text>

  <!-- Sources -->
  <rect x="20" y="60" width="260" height="480" class="grp"/>
  <text x="30" y="82" class="ttl">Signal sources</text>
  <rect x="30" y="100" width="240" height="50" class="box svc"/>
  <text x="150" y="120" text-anchor="middle" class="ttl">Lambda / API GW</text>
  <text x="150" y="136" text-anchor="middle" class="sm">structured JSON logs · X-Ray traces</text>
  <rect x="30" y="160" width="240" height="50" class="box svc"/>
  <text x="150" y="180" text-anchor="middle" class="ttl">Bedrock invocation logs</text>
  <text x="150" y="196" text-anchor="middle" class="sm">prompt · response · tokens · guardrail block</text>
  <rect x="30" y="220" width="240" height="50" class="box svc"/>
  <text x="150" y="240" text-anchor="middle" class="ttl">Guardrails events</text>
  <text x="150" y="256" text-anchor="middle" class="sm">denied topic · PHI filter · grounding score</text>
  <rect x="30" y="280" width="240" height="50" class="box svc"/>
  <text x="150" y="300" text-anchor="middle" class="ttl">chat_trace (DynamoDB)</text>
  <text x="150" y="316" text-anchor="middle" class="sm">per-query explainability record</text>
  <rect x="30" y="340" width="240" height="50" class="box aws"/>
  <text x="150" y="360" text-anchor="middle" class="ttl">CloudTrail</text>
  <text x="150" y="376" text-anchor="middle" class="sm">management + data events</text>
  <rect x="30" y="400" width="240" height="50" class="box aws"/>
  <text x="150" y="420" text-anchor="middle" class="ttl">VPC Flow Logs + GuardDuty</text>
  <text x="150" y="436" text-anchor="middle" class="sm">network anomalies · threats</text>
  <rect x="30" y="460" width="240" height="50" class="box data"/>
  <text x="150" y="480" text-anchor="middle" class="ttl">Ingestion pipeline metrics</text>
  <text x="150" y="496" text-anchor="middle" class="sm">docs/min · parse fail · schema drift</text>

  <!-- Collectors -->
  <rect x="300" y="60" width="300" height="480" class="grp"/>
  <text x="310" y="82" class="ttl">Collectors + storage</text>
  <rect x="310" y="100" width="280" height="60" class="box svc"/>
  <text x="450" y="120" text-anchor="middle" class="ttl">CloudWatch Logs + Metrics</text>
  <text x="450" y="136" text-anchor="middle" class="sm">metric filters → custom metrics</text>
  <text x="450" y="152" text-anchor="middle" class="sm">7 d hot · lifecycle to S3</text>
  <rect x="310" y="170" width="280" height="60" class="box svc"/>
  <text x="450" y="190" text-anchor="middle" class="ttl">CloudWatch Contributor Insights</text>
  <text x="450" y="206" text-anchor="middle" class="sm">top tenants · top specialties</text>
  <text x="450" y="222" text-anchor="middle" class="sm">top guardrail triggers</text>
  <rect x="310" y="240" width="280" height="60" class="box aws"/>
  <text x="450" y="260" text-anchor="middle" class="ttl">AWS X-Ray</text>
  <text x="450" y="276" text-anchor="middle" class="sm">distributed trace · retrieval → model → guardrail</text>
  <rect x="310" y="310" width="280" height="60" class="box aws"/>
  <text x="450" y="330" text-anchor="middle" class="ttl">Security Lake (OCSF)</text>
  <text x="450" y="346" text-anchor="middle" class="sm">CloudTrail · GuardDuty · Security Hub</text>
  <text x="450" y="362" text-anchor="middle" class="sm">S3 Object Lock WORM 6 years</text>
  <rect x="310" y="380" width="280" height="60" class="box data"/>
  <text x="450" y="400" text-anchor="middle" class="ttl">OpenSearch (audit index)</text>
  <text x="450" y="416" text-anchor="middle" class="sm">queryable chat_trace + guardrail events</text>
  <text x="450" y="432" text-anchor="middle" class="sm">isolated from retrieval index</text>
  <rect x="310" y="450" width="280" height="60" class="box data"/>
  <text x="450" y="470" text-anchor="middle" class="ttl">Athena over S3 audit bucket</text>
  <text x="450" y="486" text-anchor="middle" class="sm">ad-hoc regulator queries</text>
  <text x="450" y="502" text-anchor="middle" class="sm">pre-built compliance views</text>

  <!-- Signals -->
  <rect x="620" y="60" width="340" height="480" class="grp"/>
  <text x="630" y="82" class="ttl">AI-specific signals + SLOs</text>
  <rect x="630" y="100" width="320" height="60" class="box svc"/>
  <text x="790" y="120" text-anchor="middle" class="ttl">Latency SLOs</text>
  <text x="790" y="136" text-anchor="middle" class="sm">emergency p95 ≤ 2 s · complex p95 ≤ 6 s</text>
  <text x="790" y="152" text-anchor="middle" class="sm">alarm via CloudWatch → PagerDuty</text>
  <rect x="630" y="170" width="320" height="60" class="box svc"/>
  <text x="790" y="190" text-anchor="middle" class="ttl">Hallucination signal</text>
  <text x="790" y="206" text-anchor="middle" class="sm">citation-fail rate · grounding score histogram</text>
  <text x="790" y="222" text-anchor="middle" class="sm">auto-rollback on regression</text>
  <rect x="630" y="240" width="320" height="60" class="box svc"/>
  <text x="790" y="260" text-anchor="middle" class="ttl">Drift signal</text>
  <text x="790" y="276" text-anchor="middle" class="sm">embedding distribution KS test weekly</text>
  <text x="790" y="292" text-anchor="middle" class="sm">eval harness re-run on drift</text>
  <rect x="630" y="310" width="320" height="60" class="box svc"/>
  <text x="790" y="330" text-anchor="middle" class="ttl">Safety signal</text>
  <text x="790" y="346" text-anchor="middle" class="sm">guardrail block rate · PHI leak attempts · jailbreaks</text>
  <rect x="630" y="380" width="320" height="60" class="box aws"/>
  <text x="790" y="400" text-anchor="middle" class="ttl">Cost signal</text>
  <text x="790" y="416" text-anchor="middle" class="sm">$/answered-query by lane · model · tenant</text>
  <text x="790" y="432" text-anchor="middle" class="sm">budget alarms via AWS Budgets</text>
  <rect x="630" y="450" width="320" height="60" class="box aws"/>
  <text x="790" y="470" text-anchor="middle" class="ttl">Business signal</text>
  <text x="790" y="486" text-anchor="middle" class="sm">clinician satisfaction · answer-acceptance rate</text>
  <text x="790" y="502" text-anchor="middle" class="sm">feeds DPO pair collector</text>

  <!-- Consumers -->
  <rect x="980" y="60" width="280" height="480" class="grp"/>
  <text x="990" y="82" class="ttl">Consumers</text>
  <rect x="990" y="100" width="260" height="60" class="box svc"/>
  <text x="1120" y="120" text-anchor="middle" class="ttl">CloudWatch dashboards</text>
  <text x="1120" y="136" text-anchor="middle" class="sm">per-tenant · per-lane · per-model</text>
  <text x="1120" y="152" text-anchor="middle" class="sm">emergency-SLA traffic light</text>
  <rect x="990" y="170" width="260" height="60" class="box svc"/>
  <text x="1120" y="190" text-anchor="middle" class="ttl">PagerDuty / OpsGenie</text>
  <text x="1120" y="206" text-anchor="middle" class="sm">P1 for SLA breach · PHI leak</text>
  <text x="1120" y="222" text-anchor="middle" class="sm">P2 for drift · ingestion fail</text>
  <rect x="990" y="240" width="260" height="60" class="box aws"/>
  <text x="1120" y="260" text-anchor="middle" class="ttl">Hospital SIEM export</text>
  <text x="1120" y="276" text-anchor="middle" class="sm">Splunk / Sentinel / QRadar</text>
  <text x="1120" y="292" text-anchor="middle" class="sm">cross-account read on audit S3</text>
  <rect x="990" y="310" width="260" height="60" class="box aws"/>
  <text x="1120" y="330" text-anchor="middle" class="ttl">Compliance reports</text>
  <text x="1120" y="346" text-anchor="middle" class="sm">HIPAA access log · PDPA notifiable incidents</text>
  <text x="1120" y="362" text-anchor="middle" class="sm">quarterly regulator package</text>
  <rect x="990" y="380" width="260" height="60" class="box data"/>
  <text x="1120" y="400" text-anchor="middle" class="ttl">Clinical audit trail</text>
  <text x="1120" y="416" text-anchor="middle" class="sm">full answer chain + citations replayable</text>
  <text x="1120" y="432" text-anchor="middle" class="sm">KMS-signed · tamper-evident</text>
  <rect x="990" y="450" width="260" height="60" class="box data"/>
  <text x="1120" y="470" text-anchor="middle" class="ttl">Explainability UI</text>
  <text x="1120" y="486" text-anchor="middle" class="sm">citation popover · chain-of-retrieval view</text>
  <text x="1120" y="502" text-anchor="middle" class="sm">in-product for clinicians + auditors</text>

  <!-- Edges -->
  <path d="M280 125 L310 130" class="edge" marker-end="url(#a)"/>
  <path d="M280 185 L310 200" class="edge" marker-end="url(#a)"/>
  <path d="M280 305 L310 410" class="edge" marker-end="url(#a)"/>
  <path d="M280 365 L310 340" class="edge" marker-end="url(#a)"/>
  <path d="M590 130 L630 130" class="edge" marker-end="url(#a)"/>
  <path d="M590 200 L630 200" class="edge" marker-end="url(#a)"/>
  <path d="M590 340 L630 410" class="edge" marker-end="url(#a)"/>
  <path d="M950 130 L990 130" class="edge" marker-end="url(#a)"/>
  <path d="M950 270 L990 270" class="edge" marker-end="url(#a)"/>
  <path d="M950 410 L990 410" class="edge" marker-end="url(#a)"/>
  <path d="M950 480 L990 480" class="edge" marker-end="url(#a)"/>
</svg>
