<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .box  { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.2; rx:8; ry:8; }
      .svc  { fill:#eff6ff; stroke:#60a5fa; }
      .aws  { fill:#fff7ed; stroke:#fb923c; }
      .data { fill:#fefce8; stroke:#facc15; }
      .usr  { fill:#f0fdf4; stroke:#4ade80; }
      .grp  { fill:#f8fafc; stroke:#94a3b8; stroke-dasharray:4 3; rx:12; ry:12; }
      .prod { fill:#fff1f2; stroke:#dc2626; stroke-width:1.5; rx:12; ry:12; }
      .stg  { fill:#ecfdf5; stroke:#16a34a; stroke-width:1.3; rx:12; ry:12; }
      .ttl  { font-weight:700; }
      .sm   { fill:#64748b; font-size:10.5px; }
      .edge { stroke:#64748b; stroke-width:1.3; fill:none; }
    </style>
  </defs>

  <text x="640" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">
    Deployment &amp; CI/CD — public-cloud primary (Singapore) · no on-prem · Site-to-Site VPN for internal data
  </text>
  <text x="640" y="44" text-anchor="middle" font-size="12" fill="#64748b">
    3 AWS Organizations accounts (dev / staging / prod) · infra-as-code · canary + auto-rollback
  </text>

  <!-- Source -->
  <rect x="20" y="70" width="230" height="520" class="grp"/>
  <text x="30" y="92" class="ttl">Developer + source</text>

  <rect x="30" y="108" width="210" height="60" class="box usr"/>
  <text x="135" y="128" text-anchor="middle" class="ttl">GitHub (toannd021104)</text>
  <text x="135" y="144" text-anchor="middle" class="sm">monorepo: infra · lambdas · agents</text>
  <text x="135" y="160" text-anchor="middle" class="sm">branch protection + CODEOWNERS</text>

  <rect x="30" y="178" width="210" height="60" class="box usr"/>
  <text x="135" y="198" text-anchor="middle" class="ttl">PR checks</text>
  <text x="135" y="214" text-anchor="middle" class="sm">unit tests · bandit · semgrep</text>
  <text x="135" y="230" text-anchor="middle" class="sm">tfsec · checkov on Terraform</text>

  <rect x="30" y="248" width="210" height="60" class="box usr"/>
  <text x="135" y="268" text-anchor="middle" class="ttl">Model eval in CI</text>
  <text x="135" y="284" text-anchor="middle" class="sm">regression suite on holdout</text>
  <text x="135" y="300" text-anchor="middle" class="sm">hallucination + citation gates</text>

  <rect x="30" y="318" width="210" height="60" class="box usr"/>
  <text x="135" y="338" text-anchor="middle" class="ttl">Terraform modules</text>
  <text x="135" y="354" text-anchor="middle" class="sm">VPC · Cognito · Bedrock · KB</text>
  <text x="135" y="370" text-anchor="middle" class="sm">per-tenant module instance</text>

  <rect x="30" y="388" width="210" height="60" class="box usr"/>
  <text x="135" y="408" text-anchor="middle" class="ttl">SAM / CDK for Lambdas</text>
  <text x="135" y="424" text-anchor="middle" class="sm">Lambda container images · ECR</text>
  <text x="135" y="440" text-anchor="middle" class="sm">SBOM + signed digests</text>

  <rect x="30" y="458" width="210" height="60" class="box usr"/>
  <text x="135" y="478" text-anchor="middle" class="ttl">Model artifact registry</text>
  <text x="135" y="494" text-anchor="middle" class="sm">Bedrock custom-model IDs</text>
  <text x="135" y="510" text-anchor="middle" class="sm">pinned per environment</text>

  <rect x="30" y="528" width="210" height="60" class="box usr"/>
  <text x="135" y="548" text-anchor="middle" class="ttl">GitHub Actions OIDC → AWS</text>
  <text x="135" y="564" text-anchor="middle" class="sm">no long-lived AWS keys</text>
  <text x="135" y="580" text-anchor="middle" class="sm">role-chained per environment</text>

