  <text x="600" y="162" text-anchor="middle" class="sm">full Bedrock quotas × 0.3</text>
  <text x="600" y="178" text-anchor="middle" class="sm">daily sync from prod (masked)</text>

  <rect x="510" y="198" width="180" height="80" class="box data"/>
  <text x="600" y="218" text-anchor="middle" class="ttl">Load test</text>
  <text x="600" y="236" text-anchor="middle" class="sm">k6 + Locust</text>
  <text x="600" y="252" text-anchor="middle" class="sm">replay 100k prod queries</text>
  <text x="600" y="268" text-anchor="middle" class="sm">latency budget gate</text>

  <rect x="510" y="288" width="180" height="100" class="box aws"/>
  <text x="600" y="308" text-anchor="middle" class="ttl">Clinical UAT</text>
  <text x="600" y="326" text-anchor="middle" class="sm">review board · 100 prompts</text>
  <text x="600" y="342" text-anchor="middle" class="sm">clinician sign-off required</text>
  <text x="600" y="358" text-anchor="middle" class="sm">blocks prod promote</text>

  <rect x="510" y="398" width="180" height="80" class="box svc"/>
  <text x="600" y="418" text-anchor="middle" class="ttl">Red team</text>
  <text x="600" y="436" text-anchor="middle" class="sm">200+ adversarial prompts</text>
  <text x="600" y="452" text-anchor="middle" class="sm">guardrail tuning</text>

  <!-- Prod -->
  <rect x="720" y="70" width="540" height="520" class="prod"/>
  <text x="730" y="92" class="ttl">Production account — ap-southeast-1 (multi-AZ)</text>

  <rect x="730" y="108" width="260" height="80" class="box svc"/>
  <text x="860" y="128" text-anchor="middle" class="ttl">API GW + Lambda /chat</text>
  <text x="860" y="146" text-anchor="middle" class="sm">aliases with weighted routing</text>
  <text x="860" y="162" text-anchor="middle" class="sm">5% canary on every deploy</text>
  <text x="860" y="178" text-anchor="middle" class="sm">auto-rollback on SLO breach</text>

  <rect x="1000" y="108" width="250" height="80" class="box aws"/>
  <text x="1125" y="128" text-anchor="middle" class="ttl">Bedrock Agents prod</text>
  <text x="1125" y="146" text-anchor="middle" class="sm">aliases per tenant</text>
  <text x="1125" y="162" text-anchor="middle" class="sm">Reserved Tier on emergency lane</text>
  <text x="1125" y="178" text-anchor="middle" class="sm">Prompt cache warm</text>

  <rect x="730" y="198" width="260" height="80" class="box data"/>
  <text x="860" y="218" text-anchor="middle" class="ttl">OpenSearch Serverless</text>
  <text x="860" y="236" text-anchor="middle" class="sm">2 index OCU + 1 search OCU</text>
  <text x="860" y="252" text-anchor="middle" class="sm">multi-AZ · auto-scale</text>
  <text x="860" y="268" text-anchor="middle" class="sm">read replica for eval queries</text>

  <rect x="1000" y="198" width="250" height="80" class="box data"/>
  <text x="1125" y="218" text-anchor="middle" class="ttl">Neptune Analytics</text>
  <text x="1125" y="236" text-anchor="middle" class="sm">1–2 m-NCU</text>
  <text x="1125" y="252" text-anchor="middle" class="sm">snapshots KMS CMK</text>
  <text x="1125" y="268" text-anchor="middle" class="sm">restore tested quarterly</text>

  <rect x="730" y="288" width="260" height="80" class="box aws"/>
  <text x="860" y="308" text-anchor="middle" class="ttl">ElastiCache Redis OSS</text>
  <text x="860" y="326" text-anchor="middle" class="sm">cache.t4g.small · 2-AZ replication</text>
  <text x="860" y="342" text-anchor="middle" class="sm">TLS + encrypted at rest</text>
  <text x="860" y="358" text-anchor="middle" class="sm">semantic cache + session scratch</text>

  <rect x="1000" y="288" width="250" height="80" class="box aws"/>
  <text x="1125" y="308" text-anchor="middle" class="ttl">S3 Object Lock</text>
  <text x="1125" y="326" text-anchor="middle" class="sm">audit · processed · raw</text>
  <text x="1125" y="342" text-anchor="middle" class="sm">versioned · cross-Region replicate (roadmap)</text>

  <rect x="730" y="378" width="520" height="90" class="box svc"/>
