  <text x="290" y="92" class="ttl">Dev account</text>
  <rect x="290" y="108" width="180" height="80" class="box svc"/>
  <text x="380" y="128" text-anchor="middle" class="ttl">ap-southeast-1</text>
  <text x="380" y="146" text-anchor="middle" class="sm">synthetic PHI only</text>
  <text x="380" y="162" text-anchor="middle" class="sm">small Bedrock quotas</text>
  <text x="380" y="178" text-anchor="middle" class="sm">per-PR preview stack</text>

  <rect x="290" y="198" width="180" height="80" class="box data"/>
  <text x="380" y="218" text-anchor="middle" class="ttl">OpenSearch dev</text>
  <text x="380" y="236" text-anchor="middle" class="sm">1 OCU</text>
  <text x="380" y="252" text-anchor="middle" class="sm">synthetic docs</text>
  <text x="380" y="268" text-anchor="middle" class="sm">ephemeral indexes</text>

  <rect x="290" y="288" width="180" height="100" class="box aws"/>
  <text x="380" y="308" text-anchor="middle" class="ttl">Bedrock Agents dev</text>
  <text x="380" y="326" text-anchor="middle" class="sm">dev aliases</text>
  <text x="380" y="342" text-anchor="middle" class="sm">Guardrails test profile</text>
  <text x="380" y="358" text-anchor="middle" class="sm">promoted to staging on green CI</text>

  <rect x="290" y="398" width="180" height="80" class="box svc"/>
  <text x="380" y="418" text-anchor="middle" class="ttl">Integration tests</text>
  <text x="380" y="436" text-anchor="middle" class="sm">end-to-end smoke suite</text>
  <text x="380" y="452" text-anchor="middle" class="sm">FHIR sandbox · Graph sandbox</text>

