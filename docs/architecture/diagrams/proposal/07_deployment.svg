  <text x="990" y="416" text-anchor="middle" class="sm">GitHub Actions → assume role → Terraform plan/apply to prod · manual approval for prod plan</text>
  <text x="990" y="432" text-anchor="middle" class="sm">Lambda alias shift: 0% → 5% canary (72 h) → 25% → 100% if error rate &amp; latency green</text>
  <text x="990" y="448" text-anchor="middle" class="sm">Bedrock Agent alias: staging → prod gated on UAT + red team · model ID pinned</text>

  <rect x="730" y="478" width="520" height="110" class="box usr"/>
  <text x="990" y="498" text-anchor="middle" class="ttl">DR &amp; BCP</text>
  <text x="990" y="516" text-anchor="middle" class="sm">RPO 15 min · RTO 60 min within ap-southeast-1 (multi-AZ)</text>
  <text x="990" y="532" text-anchor="middle" class="sm">Warm standby in Tokyo (ap-northeast-1) on roadmap after PDPA transfer assessment</text>
  <text x="990" y="548" text-anchor="middle" class="sm">Bedrock custom-model ID is global · Neptune snapshot restore runbook quarterly</text>
  <text x="990" y="564" text-anchor="middle" class="sm">Game-day: simulated AZ loss · semantic cache flush · Reserved Tier throttle failover</text>
  <text x="990" y="580" text-anchor="middle" class="sm">Backup Vault Lock (immutable) cross-account copy for audit bucket</text>

  <!-- Edges -->
  <path d="M245 138 L280 138" class="edge" marker-end="url(#a)"/>
  <path d="M470 148 L500 148" class="edge" marker-end="url(#a)"/>
  <path d="M690 148 L720 148" class="edge" marker-end="url(#a)"/>
</svg>
