<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 880" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="arr-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="arr-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <style>
      .box       { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.2; rx:8; ry:8; }
      .box-hosp  { fill:#eff6ff; stroke:#60a5fa; stroke-width:1.5; }
      .box-nova  { fill:#fff7ed; stroke:#fb923c; stroke-width:1.5; }
      .box-ext   { fill:#f5f3ff; stroke:#7c3aed; stroke-width:1.5; }
      .box-id    { fill:#fefce8; stroke:#facc15; }
      .box-ctl   { fill:#f0fdf4; stroke:#16a34a; stroke-width:1.5; }
      .box-data  { fill:#fef2f2; stroke:#dc2626; stroke-width:1.5; }
      .group     { fill:#f8fafc; stroke:#94a3b8; stroke-dasharray:4 3; stroke-width:1.2; rx:12; ry:12; }
      .title     { font-weight:700; fill:#0f172a; }
      .lbl-sm    { fill:#64748b; font-size:10.5px; }
      .edge      { stroke:#64748b; stroke-width:1.3; fill:none; }
      .edge-ctl  { stroke:#16a34a; stroke-width:1.8; fill:none; }
      .edge-data { stroke:#dc2626; stroke-width:1.8; fill:none; stroke-dasharray:6 3; }
      .edge-ext  { stroke:#7c3aed; stroke-width:1.6; fill:none; }
    </style>
  </defs>

  <text x="680" y="28" text-anchor="middle" font-size="17" class="title">Corporate Integration — Two-Plane Model · EHR · IAM · SharePoint · External APIs (§7)</text>
  <text x="680" y="48" text-anchor="middle" class="lbl-sm">Control plane (green) = clinician chat over public HTTPS + WAF IP allow-list · Data plane (dashed red) = bulk PHI over Site-to-Site IPsec VPN · External APIs (purple)</text>

  <!-- PLANE LEGEND -->
  <g transform="translate(20,70)">
    <rect width="340" height="14" class="box-ctl"/><text x="8" y="11" class="lbl-sm" fill="#16a34a"><tspan font-weight="700">Control plane</tspan> — clinician chat · public HTTPS + TLS 1.3</text>
    <rect y="18" width="340" height="14" class="box-data"/><text x="8" y="29" class="lbl-sm" fill="#dc2626"><tspan font-weight="700">Data plane</tspan> — bulk PHI · Site-to-Site IPsec VPN</text>
    <rect y="36" width="340" height="14" class="box-ext"/><text x="8" y="47" class="lbl-sm" fill="#7c3aed">External APIs — runtime agent tools + ingest</text>
  </g>

  <!-- LEFT: Hospital IT systems -->
  <rect x="20" y="120" width="400" height="660" class="group"/>
  <text x="40" y="142" class="title">Hospital IT systems</text>

  <rect x="40" y="160" width="370" height="90" class="box box-hosp"/>
  <text x="225" y="182" text-anchor="middle" class="title">EHR (Epic / Cerner / Allscripts)</text>
  <text x="225" y="202" text-anchor="middle" class="lbl-sm">FHIR R4 endpoint · SMART App Launch v2</text>
  <text x="225" y="218" text-anchor="middle" class="lbl-sm">Internet-reachable FHIR → control plane</text>
  <text x="225" y="236" text-anchor="middle" class="lbl-sm">On-prem-only FHIR → data plane VPN</text>

  <rect x="40" y="260" width="370" height="80" class="box box-id"/>
  <text x="225" y="282" text-anchor="middle" class="title">Hospital IdP</text>
  <text x="225" y="300" text-anchor="middle" class="lbl-sm">Microsoft EntraID · Okta · ADFS · Keycloak</text>
  <text x="225" y="316" text-anchor="middle" class="lbl-sm">SAML 2.0 or OIDC · public HTTPS</text>
  <text x="225" y="332" text-anchor="middle" class="lbl-sm">MFA enforced at IdP</text>

  <rect x="40" y="350" width="370" height="90" class="box box-hosp"/>
  <text x="225" y="372" text-anchor="middle" class="title">SharePoint / OneDrive</text>
  <text x="225" y="392" text-anchor="middle" class="lbl-sm">Bulk trial reports + protocols (PHI-bearing)</text>
  <text x="225" y="408" text-anchor="middle" class="lbl-sm">Online → Microsoft Graph webhook over VPN</text>
  <text x="225" y="424" text-anchor="middle" class="lbl-sm">Server on-prem → SAE puller over VPN</text>

  <rect x="40" y="450" width="370" height="70" class="box box-hosp"/>
  <text x="225" y="472" text-anchor="middle" class="title">Other document sources</text>
  <text x="225" y="490" text-anchor="middle" class="lbl-sm">SMB / NFS trial shares · Confluence · G Drive</text>
  <text x="225" y="506" text-anchor="middle" class="lbl-sm">All PHI-bearing sources → data plane VPN</text>

  <rect x="40" y="530" width="370" height="80" class="box box-hosp"/>
  <text x="225" y="552" text-anchor="middle" class="title">Clinician workstations</text>
  <text x="225" y="570" text-anchor="middle" class="lbl-sm">Chrome 120+ / Edge 120+ / Safari 17+</text>
  <text x="225" y="586" text-anchor="middle" class="lbl-sm">Chat UI always control plane (public HTTPS)</text>
  <text x="225" y="602" text-anchor="middle" class="lbl-sm">EHR iframe launch or standalone Nova web app</text>

  <rect x="40" y="620" width="370" height="60" class="box"/>
  <text x="225" y="642" text-anchor="middle" class="title">Egress firewall rule</text>
  <text x="225" y="660" text-anchor="middle" class="lbl-sm">Whitelist Nova API IP range + domain</text>
  <text x="225" y="674" text-anchor="middle" class="lbl-sm">Applies to control-plane outbound HTTPS</text>

  <rect x="40" y="690" width="370" height="70" class="box box-data"/>
  <text x="225" y="712" text-anchor="middle" class="title">Customer Gateway (IPsec endpoint)</text>
  <text x="225" y="730" text-anchor="middle" class="lbl-sm">Existing firewall — IKEv2 AES-256-GCM</text>
  <text x="225" y="746" text-anchor="middle" class="lbl-sm">Terminates data-plane VPN tunnel</text>

  <!-- MIDDLE: Nova platform -->
  <rect x="440" y="120" width="520" height="660" class="group"/>
  <text x="460" y="142" class="title">Nova platform on Alibaba Cloud Singapore</text>

  <rect x="460" y="160" width="480" height="90" class="box box-ctl"/>
  <text x="700" y="182" text-anchor="middle" class="title">CDN + WAF + API Gateway + IDaaS EIAM 2.0 Premium+</text>
  <text x="700" y="202" text-anchor="middle" class="lbl-sm">Control plane entry · TLS 1.3 · IDaaS federates via SAML/OIDC to hospital IdP</text>
  <text x="700" y="218" text-anchor="middle" class="lbl-sm">WAF per-tenant IP allow-list + Anti-DDoS</text>
  <text x="700" y="236" text-anchor="middle" class="lbl-sm">Session: 60 min clinician · 15 min admin · step-up MFA on admin:*</text>

  <rect x="460" y="260" width="480" height="80" class="box box-nova"/>
  <text x="700" y="282" text-anchor="middle" class="title">FC /chat — SMART on FHIR launch handler</text>
  <text x="700" y="300" text-anchor="middle" class="lbl-sm">Exchange launch ctx → FHIR patient bundle</text>
  <text x="700" y="316" text-anchor="middle" class="lbl-sm">Extract minimum slice · DataWorks SDDP mask before LLM call</text>
  <text x="700" y="332" text-anchor="middle" class="lbl-sm">FHIR callback uses control plane OR data-plane VPN depending on EHR reachability</text>

  <rect x="460" y="350" width="230" height="100" class="box box-nova"/>
  <text x="575" y="372" text-anchor="middle" class="title">Scopes requested</text>
  <text x="575" y="390" text-anchor="middle" class="lbl-sm">launch openid fhirUser</text>
  <text x="575" y="406" text-anchor="middle" class="lbl-sm">patient/Patient.rs</text>
  <text x="575" y="420" text-anchor="middle" class="lbl-sm">patient/Condition.rs</text>
  <text x="575" y="434" text-anchor="middle" class="lbl-sm">patient/MedicationStatement.rs</text>

  <rect x="705" y="350" width="235" height="100" class="box box-nova"/>
  <text x="820" y="372" text-anchor="middle" class="title">RBAC (at API GW + FC)</text>
  <text x="820" y="390" text-anchor="middle" class="lbl-sm">chat:clinical (clinician)</text>
  <text x="820" y="406" text-anchor="middle" class="lbl-sm">curator:upload (data curator)</text>
  <text x="820" y="420" text-anchor="middle" class="lbl-sm">kb:read (admin, audit-logged)</text>
  <text x="820" y="434" text-anchor="middle" class="lbl-sm">admin:* (break-glass 2-person)</text>

  <rect x="460" y="460" width="480" height="80" class="box box-data"/>
  <text x="700" y="482" text-anchor="middle" class="title">VPN Gateway (data plane)</text>
  <text x="700" y="500" text-anchor="middle" class="lbl-sm">Alibaba VPN Gateway · IPsec · IKEv2 · 100 Mbps · dual-tunnel</text>
  <text x="700" y="516" text-anchor="middle" class="lbl-sm">Terminates hospital Customer Gateway tunnel · BGP dynamic routing</text>
  <text x="700" y="532" text-anchor="middle" class="lbl-sm">Carries SharePoint/SMB pull + on-prem FHIR callback + Upload Portal</text>

  <rect x="460" y="550" width="480" height="90" class="box box-data"/>
  <text x="700" y="572" text-anchor="middle" class="title">SAE — SharePoint/SMB puller + Upload Portal (data plane)</text>
  <text x="700" y="590" text-anchor="middle" class="lbl-sm">Behind private SLB · only reachable from hospital via VPN</text>
  <text x="700" y="606" text-anchor="middle" class="lbl-sm">Curator UI · OIDC to hospital IdP · presigned OSS PUT (10-min TTL)</text>
  <text x="700" y="622" text-anchor="middle" class="lbl-sm">Puller: scheduled weekly + Graph-webhook-triggered</text>

  <rect x="460" y="650" width="480" height="60" class="box box-nova"/>
  <text x="700" y="672" text-anchor="middle" class="title">FC webhook receiver — Microsoft Graph subscriptions</text>
  <text x="700" y="690" text-anchor="middle" class="lbl-sm">Webhook notification arrives on control plane · puller fetches content over data-plane VPN</text>

  <rect x="460" y="720" width="480" height="35" class="box"/>
  <text x="700" y="742" text-anchor="middle" class="title">Staff identity — Cloud SSO + RAM federated to Nova EntraID</text>

  <!-- RIGHT: External APIs + staff -->
  <rect x="980" y="120" width="370" height="660" class="group"/>
  <text x="1000" y="142" class="title">External APIs &amp; Nova staff</text>

  <rect x="1000" y="160" width="340" height="110" class="box box-ext"/>
  <text x="1170" y="182" text-anchor="middle" class="title">WHO ICD-11 API</text>
  <text x="1170" y="202" text-anchor="middle" class="lbl-sm">Registered OAuth2 client</text>
  <text x="1170" y="218" text-anchor="middle" class="lbl-sm">icd.who.int/icdapi · public Internet</text>
  <text x="1170" y="234" text-anchor="middle" class="lbl-sm">(1) daily delta ingest</text>
  <text x="1170" y="250" text-anchor="middle" class="lbl-sm">(2) runtime tool (3) query expansion</text>

  <rect x="1000" y="280" width="340" height="90" class="box box-ext"/>
  <text x="1170" y="302" text-anchor="middle" class="title">NCBI PubMed E-utilities</text>
  <text x="1170" y="322" text-anchor="middle" class="lbl-sm">eutils.ncbi.nlm.nih.gov · public</text>
  <text x="1170" y="338" text-anchor="middle" class="lbl-sm">Free: 3 req/s · API key: 10 req/s</text>
  <text x="1170" y="354" text-anchor="middle" class="lbl-sm">No preemptive ingest</text>

  <rect x="1000" y="380" width="340" height="90" class="box box-ext"/>
  <text x="1170" y="402" text-anchor="middle" class="title">Microsoft Graph API (control plane)</text>
  <text x="1170" y="422" text-anchor="middle" class="lbl-sm">graph.microsoft.com · public HTTPS</text>
  <text x="1170" y="438" text-anchor="middle" class="lbl-sm">Subscription registration · Sites.Selected</text>
  <text x="1170" y="454" text-anchor="middle" class="lbl-sm">Notification arrives; content fetched over VPN</text>

  <rect x="1000" y="480" width="340" height="100" class="box box-ext"/>
  <text x="1170" y="502" text-anchor="middle" class="title">Credentials Manager secrets</text>
  <text x="1170" y="522" text-anchor="middle" class="lbl-sm">WHO OAuth (90-day rotation)</text>
  <text x="1170" y="538" text-anchor="middle" class="lbl-sm">Graph app secret (90-day)</text>
  <text x="1170" y="554" text-anchor="middle" class="lbl-sm">Model Studio API keys (60-day)</text>
  <text x="1170" y="570" text-anchor="middle" class="lbl-sm">VPN pre-shared keys (90-day)</text>

  <rect x="1000" y="590" width="340" height="80" class="box"/>
  <text x="1170" y="612" text-anchor="middle" class="title">Nova staff</text>
  <text x="1170" y="630" text-anchor="middle" class="lbl-sm">Nova EntraID tenant</text>
  <text x="1170" y="648" text-anchor="middle" class="lbl-sm">SRE · Compliance · Architects</text>
  <text x="1170" y="664" text-anchor="middle" class="lbl-sm">Federated via Cloud SSO + RAM</text>

  <rect x="1000" y="680" width="340" height="70" class="box box-ext"/>
  <text x="1170" y="702" text-anchor="middle" class="title">NAT Gateway (egress allow-list)</text>
  <text x="1170" y="720" text-anchor="middle" class="lbl-sm">WHO + NCBI + Graph only</text>
  <text x="1170" y="736" text-anchor="middle" class="lbl-sm">Everything else denied at VPC</text>

  <!-- ARROWS -->
  <!-- Control plane: Hospital clinician/EHR iframe → Nova CDN+WAF -->
  <path d="M410 205 L460 205" class="edge-ctl" marker-end="url(#arr-ctl)"/>
  <text x="435" y="195" text-anchor="middle" class="lbl-sm" fill="#16a34a">SMART on FHIR (public)</text>

  <!-- Hospital IdP ↔ IDaaS federation -->
  <path d="M410 300 L460 215" class="edge-ctl" marker-end="url(#arr-ctl)"/>
  <text x="435" y="270" class="lbl-sm" fill="#16a34a">SAML/OIDC fed.</text>

  <!-- Clinician browser → Nova web app (control plane) -->
  <path d="M410 580 Q430 580 460 230" class="edge-ctl" marker-end="url(#arr-ctl)"/>

  <!-- Data plane: Hospital VPN endpoint → Nova VPN Gateway -->
  <path d="M410 725 L460 500" class="edge-data" marker-end="url(#arr-data)"/>
  <text x="415" y="710" class="lbl-sm" fill="#dc2626">IPsec tunnel</text>

  <!-- SharePoint → VPN (data plane) -->
  <path d="M410 400 L460 490" class="edge-data" marker-end="url(#arr-data)"/>
  <text x="415" y="430" class="lbl-sm" fill="#dc2626">bulk PHI pull</text>

  <!-- Other sources → VPN -->
  <path d="M410 485 L460 510" class="edge-data" marker-end="url(#arr-data)"/>

  <!-- Graph webhook ingress is public HTTPS, but then content fetch is VPN -->
  <path d="M940 400 Q970 470 970 680" class="edge" marker-end="url(#arr)"/>

  <!-- External APIs to FC -->
  <path d="M940 245 Q970 200 1000 210" class="edge-ext" marker-end="url(#arr-ext)"/>
  <text x="975" y="175" class="lbl-sm" fill="#7c3aed">ingest + runtime</text>
  <path d="M940 310 L1000 325" class="edge-ext" marker-end="url(#arr-ext)"/>
  <text x="970" y="308" class="lbl-sm" fill="#7c3aed">agent tool</text>
  <path d="M940 300 L1000 395" class="edge-ext" marker-end="url(#arr-ext)"/>

  <!-- NAT Gateway gates egress -->
  <path d="M1000 210 Q970 440 970 700" class="edge"/>
  <path d="M1000 325 Q970 500 970 700" class="edge"/>

  <!-- Credentials Manager → FC + VPN -->
  <path d="M1000 530 L940 340" class="edge" marker-end="url(#arr)"/>
  <path d="M1000 555 L940 500" class="edge" marker-end="url(#arr)"/>

  <!-- Nova staff → Cloud SSO -->
  <path d="M1000 635 L940 740" class="edge" marker-end="url(#arr)"/>
</svg>
