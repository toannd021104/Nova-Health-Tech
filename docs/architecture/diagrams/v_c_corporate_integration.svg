<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 820" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="arr-hc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="arr-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="arr-vpn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <style>
      .box       { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.2; rx:8; ry:8; }
      .box-hosp  { fill:#eff6ff; stroke:#60a5fa; stroke-width:1.5; }
      .box-nova  { fill:#fff7ed; stroke:#fb923c; stroke-width:1.5; }
      .box-ext   { fill:#f5f3ff; stroke:#7c3aed; stroke-width:1.5; }
      .box-id    { fill:#fefce8; stroke:#facc15; }
      .box-vpn   { fill:#fef2f2; stroke:#dc2626; stroke-width:1.5; stroke-dasharray:4 3; }
      .group     { fill:#f8fafc; stroke:#94a3b8; stroke-dasharray:4 3; stroke-width:1.2; rx:12; ry:12; }
      .title     { font-weight:700; fill:#0f172a; }
      .lbl-sm    { fill:#64748b; font-size:10.5px; }
      .edge      { stroke:#64748b; stroke-width:1.3; fill:none; }
      .edge-hc   { stroke:#1d4ed8; stroke-width:1.8; fill:none; }
      .edge-ext  { stroke:#7c3aed; stroke-width:1.6; fill:none; }
      .edge-vpn  { stroke:#dc2626; stroke-width:1.8; fill:none; stroke-dasharray:6 3; }
    </style>
  </defs>

  <text x="680" y="28" text-anchor="middle" font-size="17" class="title">Corporate Integration — EHR · IAM · SharePoint · External APIs (§7)</text>
  <text x="680" y="48" text-anchor="middle" class="lbl-sm">SMART on FHIR R4 · OIDC/SAML federation · Graph webhooks · WHO ICD-11 + PubMed agent tools · IPsec VPN for internal traffic</text>

  <!-- LEFT: Hospital IT systems -->
  <rect x="20" y="80" width="400" height="680" class="group"/>
  <text x="40" y="102" class="title">Hospital IT systems</text>

  <rect x="40" y="120" width="370" height="90" class="box box-hosp"/>
  <text x="225" y="142" text-anchor="middle" class="title">EHR (Epic / Cerner / Allscripts)</text>
  <text x="225" y="162" text-anchor="middle" class="lbl-sm">FHIR R4 endpoint · SMART App Launch v2</text>
  <text x="225" y="178" text-anchor="middle" class="lbl-sm">Iframe launch with ?iss=&lt;fhir&gt;&amp;launch=&lt;ctx&gt;</text>
  <text x="225" y="196" text-anchor="middle" class="lbl-sm">Read-only scopes · never writes to EHR</text>

  <rect x="40" y="220" width="370" height="80" class="box box-id"/>
  <text x="225" y="242" text-anchor="middle" class="title">Hospital IdP</text>
  <text x="225" y="260" text-anchor="middle" class="lbl-sm">Microsoft EntraID · Okta · ADFS · Keycloak</text>
  <text x="225" y="276" text-anchor="middle" class="lbl-sm">SAML 2.0 or OIDC</text>
  <text x="225" y="292" text-anchor="middle" class="lbl-sm">MFA enforced at IdP</text>

  <rect x="40" y="310" width="370" height="80" class="box box-hosp"/>
  <text x="225" y="332" text-anchor="middle" class="title">SharePoint / OneDrive</text>
  <text x="225" y="350" text-anchor="middle" class="lbl-sm">Microsoft Graph · Sites.Selected scope</text>
  <text x="225" y="366" text-anchor="middle" class="lbl-sm">Change-notification subscriptions (30-day max)</text>
  <text x="225" y="382" text-anchor="middle" class="lbl-sm">Alt: Event Hubs delivery for high-traffic drives</text>

  <rect x="40" y="400" width="370" height="70" class="box box-hosp"/>
  <text x="225" y="422" text-anchor="middle" class="title">Other document systems</text>
  <text x="225" y="440" text-anchor="middle" class="lbl-sm">Google Drive (files.watch) · Confluence (webhooks)</text>
  <text x="225" y="456" text-anchor="middle" class="lbl-sm">On-prem NFS/SMB (scheduled puller over VPN)</text>

  <rect x="40" y="480" width="370" height="80" class="box box-hosp"/>
  <text x="225" y="502" text-anchor="middle" class="title">Clinician workstations</text>
  <text x="225" y="520" text-anchor="middle" class="lbl-sm">Browser (Chrome 120+ / Edge 120+ / Safari 17+)</text>
  <text x="225" y="536" text-anchor="middle" class="lbl-sm">Nova chat UI embedded in EHR iframe OR</text>
  <text x="225" y="552" text-anchor="middle" class="lbl-sm">standalone Nova web app</text>

  <rect x="40" y="570" width="370" height="70" class="box box-hosp"/>
  <text x="225" y="592" text-anchor="middle" class="title">MS Teams (post-launch enhancement)</text>
  <text x="225" y="610" text-anchor="middle" class="lbl-sm">Teams Messaging Extension (search-based)</text>
  <text x="225" y="626" text-anchor="middle" class="lbl-sm">same auth + FHIR context pattern</text>

  <rect x="40" y="650" width="370" height="90" class="box box-vpn"/>
  <text x="225" y="672" text-anchor="middle" class="title">Customer Gateway (IPsec endpoint)</text>
  <text x="225" y="692" text-anchor="middle" class="lbl-sm">Existing hospital firewall/router</text>
  <text x="225" y="708" text-anchor="middle" class="lbl-sm">IKEv2 · AES-256-GCM · SHA-2 · dual-tunnel HA</text>
  <text x="225" y="724" text-anchor="middle" class="lbl-sm">1.25 Gbps per tunnel</text>

  <!-- MIDDLE: Nova platform -->
  <rect x="440" y="80" width="520" height="680" class="group"/>
  <text x="460" y="102" class="title">Nova platform on Alibaba Cloud Singapore</text>

  <rect x="460" y="120" width="480" height="90" class="box box-nova"/>
  <text x="700" y="142" text-anchor="middle" class="title">API Gateway + IDaaS EIAM 2.0 Premium+</text>
  <text x="700" y="162" text-anchor="middle" class="lbl-sm">IDaaS federates via SAML/OIDC to each hospital's IdP</text>
  <text x="700" y="178" text-anchor="middle" class="lbl-sm">Cognito-style user pool · per-tenant configuration</text>
  <text x="700" y="196" text-anchor="middle" class="lbl-sm">Session timeout: 60 min clinician · 15 min admin</text>

  <rect x="460" y="220" width="480" height="80" class="box box-nova"/>
  <text x="700" y="242" text-anchor="middle" class="title">FC /chat — SMART on FHIR launch handler</text>
  <text x="700" y="260" text-anchor="middle" class="lbl-sm">5a. Exchange launch ctx → FHIR patient bundle</text>
  <text x="700" y="276" text-anchor="middle" class="lbl-sm">5b. Extract minimum slice (Patient, Condition, MedicationStatement, AllergyIntolerance, Observation, Encounter)</text>
  <text x="700" y="292" text-anchor="middle" class="lbl-sm">5c. DataWorks SDDP mask before LLM call</text>

  <rect x="460" y="310" width="230" height="100" class="box box-nova"/>
  <text x="575" y="332" text-anchor="middle" class="title">Scopes requested</text>
  <text x="575" y="350" text-anchor="middle" class="lbl-sm">launch openid fhirUser</text>
  <text x="575" y="366" text-anchor="middle" class="lbl-sm">patient/Patient.rs</text>
  <text x="575" y="380" text-anchor="middle" class="lbl-sm">patient/Condition.rs</text>
  <text x="575" y="394" text-anchor="middle" class="lbl-sm">patient/MedicationStatement.rs</text>

  <rect x="705" y="310" width="235" height="100" class="box box-nova"/>
  <text x="820" y="332" text-anchor="middle" class="title">RBAC (enforced at API GW + FC)</text>
  <text x="820" y="350" text-anchor="middle" class="lbl-sm">chat:clinical (clinician)</text>
  <text x="820" y="366" text-anchor="middle" class="lbl-sm">curator:upload (data curator)</text>
  <text x="820" y="380" text-anchor="middle" class="lbl-sm">kb:read (admin, audit-logged)</text>
  <text x="820" y="394" text-anchor="middle" class="lbl-sm">admin:* (break-glass 2-person)</text>

  <rect x="460" y="420" width="480" height="90" class="box box-nova"/>
  <text x="700" y="442" text-anchor="middle" class="title">FC webhook receiver — Microsoft Graph subscriptions</text>
  <text x="700" y="462" text-anchor="middle" class="lbl-sm">POST /webhooks/graph · validates clientState secret</text>
  <text x="700" y="478" text-anchor="middle" class="lbl-sm">POST /webhooks/graph-lifecycle · auto-renews 30-day subscription</text>
  <text x="700" y="494" text-anchor="middle" class="lbl-sm">Event → OSS /raw/sharepoint/&lt;tenant&gt;/ → ingestion Workflow</text>

  <rect x="460" y="520" width="480" height="70" class="box box-nova"/>
  <text x="700" y="540" text-anchor="middle" class="title">SAE container — Upload Portal</text>
  <text x="700" y="558" text-anchor="middle" class="lbl-sm">Internal curator UI · OIDC to hospital IdP</text>
  <text x="700" y="574" text-anchor="middle" class="lbl-sm">Presigned OSS PUT (10-min TTL) · role-gated</text>

  <rect x="460" y="600" width="480" height="80" class="box box-nova"/>
  <text x="700" y="622" text-anchor="middle" class="title">VPN Gateway (SG) — IPsec</text>
  <text x="700" y="640" text-anchor="middle" class="lbl-sm">Terminates hospital Customer Gateway tunnel</text>
  <text x="700" y="656" text-anchor="middle" class="lbl-sm">Only egress path: SharePoint + EHR FHIR + Upload Portal</text>
  <text x="700" y="672" text-anchor="middle" class="lbl-sm">No other hospital → cloud flows by default</text>

  <rect x="460" y="690" width="480" height="60" class="box"/>
  <text x="700" y="712" text-anchor="middle" class="title">Staff identity — Cloud SSO + RAM</text>
  <text x="700" y="730" text-anchor="middle" class="lbl-sm">Federated to Nova EntraID · no long-lived access keys</text>

  <!-- RIGHT: External APIs + staff -->
  <rect x="980" y="80" width="370" height="680" class="group"/>
  <text x="1000" y="102" class="title">External APIs &amp; Nova staff</text>

  <rect x="1000" y="120" width="340" height="110" class="box box-ext"/>
  <text x="1170" y="142" text-anchor="middle" class="title">WHO ICD-11 API</text>
  <text x="1170" y="162" text-anchor="middle" class="lbl-sm">Registered OAuth2 client</text>
  <text x="1170" y="178" text-anchor="middle" class="lbl-sm">icd.who.int/icdapi</text>
  <text x="1170" y="196" text-anchor="middle" class="lbl-sm">Used 3 ways:</text>
  <text x="1170" y="212" text-anchor="middle" class="lbl-sm">(1) daily delta ingest</text>
  <text x="1170" y="226" text-anchor="middle" class="lbl-sm">(2) runtime tool (3) query expansion</text>

  <rect x="1000" y="240" width="340" height="100" class="box box-ext"/>
  <text x="1170" y="262" text-anchor="middle" class="title">NCBI PubMed E-utilities</text>
  <text x="1170" y="282" text-anchor="middle" class="lbl-sm">eutils.ncbi.nlm.nih.gov</text>
  <text x="1170" y="300" text-anchor="middle" class="lbl-sm">Agent tool — runtime only</text>
  <text x="1170" y="316" text-anchor="middle" class="lbl-sm">Free: 3 req/s · API key: 10 req/s</text>
  <text x="1170" y="332" text-anchor="middle" class="lbl-sm">No preemptive ingest</text>

  <rect x="1000" y="350" width="340" height="90" class="box box-ext"/>
  <text x="1170" y="372" text-anchor="middle" class="title">Microsoft Graph API</text>
  <text x="1170" y="392" text-anchor="middle" class="lbl-sm">graph.microsoft.com/v1.0/subscriptions</text>
  <text x="1170" y="408" text-anchor="middle" class="lbl-sm">Sites.Selected app permission</text>
  <text x="1170" y="424" text-anchor="middle" class="lbl-sm">30-day subscription + auto-renew</text>

  <rect x="1000" y="450" width="340" height="100" class="box box-ext"/>
  <text x="1170" y="472" text-anchor="middle" class="title">Credentials Manager-held secrets</text>
  <text x="1170" y="492" text-anchor="middle" class="lbl-sm">WHO OAuth client (90-day rotation)</text>
  <text x="1170" y="508" text-anchor="middle" class="lbl-sm">Graph app secret (90-day)</text>
  <text x="1170" y="524" text-anchor="middle" class="lbl-sm">Model Studio API keys (60-day)</text>
  <text x="1170" y="540" text-anchor="middle" class="lbl-sm">Webhook clientState (90-day)</text>

  <rect x="1000" y="560" width="340" height="90" class="box"/>
  <text x="1170" y="582" text-anchor="middle" class="title">Nova staff</text>
  <text x="1170" y="602" text-anchor="middle" class="lbl-sm">Nova EntraID tenant</text>
  <text x="1170" y="618" text-anchor="middle" class="lbl-sm">SRE · Compliance · Architects</text>
  <text x="1170" y="634" text-anchor="middle" class="lbl-sm">Federated via Cloud SSO + RAM</text>

  <rect x="1000" y="660" width="340" height="90" class="box box-ext"/>
  <text x="1170" y="682" text-anchor="middle" class="title">NAT Gateway (egress allow-list)</text>
  <text x="1170" y="702" text-anchor="middle" class="lbl-sm">Only destinations WHO + NCBI + Graph</text>
  <text x="1170" y="718" text-anchor="middle" class="lbl-sm">Everything else denied at VPC level</text>

  <!-- ARROWS -->
  <!-- Clinician EHR iframe → IDaaS → FC -->
  <path d="M410 165 L460 165" class="edge-hc" marker-end="url(#arr-hc)"/>
  <text x="430" y="155" text-anchor="middle" class="lbl-sm" fill="#1d4ed8">SMART on FHIR</text>

  <!-- IdP → IDaaS -->
  <path d="M410 265 L460 170" class="edge-hc" marker-end="url(#arr-hc)"/>
  <text x="435" y="260" class="lbl-sm" fill="#1d4ed8">SAML/OIDC federation</text>

  <!-- SharePoint → Graph webhook → FC -->
  <path d="M410 350 L460 465" class="edge-hc" marker-end="url(#arr-hc)"/>
  <text x="435" y="405" class="lbl-sm" fill="#1d4ed8">Graph subscription POST</text>

  <!-- FC → EHR FHIR (over VPN back to hospital) -->
  <path d="M460 260 L430 250 Q380 250 380 540 L380 690 L410 690" class="edge-vpn" marker-end="url(#arr-vpn)"/>
  <text x="385" y="500" class="lbl-sm" fill="#dc2626">FHIR R4 over IPsec VPN</text>

  <!-- Customer GW → VPN GW -->
  <path d="M410 640 L460 640" class="edge-vpn" marker-end="url(#arr-vpn)"/>

  <!-- Clinician browser → Nova web app / iframe -->
  <path d="M410 520 Q430 520 460 220" class="edge-hc" marker-end="url(#arr-hc)"/>

  <!-- FC → External APIs -->
  <path d="M940 245 Q970 200 1000 175" class="edge-ext" marker-end="url(#arr-ext)"/>
  <text x="975" y="193" class="lbl-sm" fill="#7c3aed">runtime tool + ingest</text>
  <path d="M940 270 L1000 290" class="edge-ext" marker-end="url(#arr-ext)"/>
  <text x="970" y="285" class="lbl-sm" fill="#7c3aed">agent tool</text>
  <path d="M940 460 L1000 395" class="edge-ext" marker-end="url(#arr-ext)"/>
  <text x="970" y="425" class="lbl-sm" fill="#7c3aed">webhook subscribe</text>

  <!-- NAT Gateway gates external egress -->
  <path d="M1000 175 Q970 400 970 680" class="edge" marker-end="url(#arr)"/>
  <path d="M1000 290 Q970 500 970 680" class="edge" marker-end="url(#arr)"/>
  <path d="M1000 395 Q970 550 970 680" class="edge" marker-end="url(#arr)"/>
  <text x="965" y="760" text-anchor="middle" class="lbl-sm">all external calls pass through allow-listed NAT</text>

  <!-- Credentials Manager → FC -->
  <path d="M1000 500 L940 320" class="edge" marker-end="url(#arr)"/>
  <text x="975" y="385" class="lbl-sm">retrieve at cold start</text>

  <!-- Nova staff → Cloud SSO -->
  <path d="M1000 605 L940 720" class="edge" marker-end="url(#arr)"/>
</svg>
