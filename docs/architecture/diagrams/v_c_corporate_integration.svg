<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 860" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="arr-hc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="arr-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="arr-vpn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
    <marker id="arr-saas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <style>
      .box       { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.2; rx:8; ry:8; }
      .box-hosp  { fill:#eff6ff; stroke:#60a5fa; stroke-width:1.5; }
      .box-nova  { fill:#fff7ed; stroke:#fb923c; stroke-width:1.5; }
      .box-ext   { fill:#f5f3ff; stroke:#7c3aed; stroke-width:1.5; }
      .box-id    { fill:#fefce8; stroke:#facc15; }
      .box-vpn   { fill:#fef2f2; stroke:#dc2626; stroke-width:1.5; stroke-dasharray:4 3; }
      .box-saas  { fill:#f0fdf4; stroke:#16a34a; stroke-width:1.5; }
      .group     { fill:#f8fafc; stroke:#94a3b8; stroke-dasharray:4 3; stroke-width:1.2; rx:12; ry:12; }
      .title     { font-weight:700; fill:#0f172a; }
      .lbl-sm    { fill:#64748b; font-size:10.5px; }
      .edge      { stroke:#64748b; stroke-width:1.3; fill:none; }
      .edge-hc   { stroke:#1d4ed8; stroke-width:1.8; fill:none; }
      .edge-ext  { stroke:#7c3aed; stroke-width:1.6; fill:none; }
      .edge-vpn  { stroke:#dc2626; stroke-width:1.8; fill:none; stroke-dasharray:6 3; }
      .edge-saas { stroke:#16a34a; stroke-width:1.8; fill:none; }
    </style>
  </defs>

  <text x="680" y="28" text-anchor="middle" font-size="17" class="title">Corporate Integration — SaaS-default · EHR · IAM · SharePoint · External APIs (§7)</text>
  <text x="680" y="48" text-anchor="middle" class="lbl-sm">Mode 1 (public HTTPS · green) = baseline · Mode 2 (IPsec VPN · dashed red) = opt-in for on-prem-only hospitals · External agent tools (purple)</text>

  <!-- MODE LEGEND -->
  <g transform="translate(20,70)">
    <rect width="300" height="14" class="box-saas"/><text x="8" y="11" class="lbl-sm" fill="#16a34a"><tspan font-weight="700">Mode 1 (SaaS default)</tspan> — public HTTPS</text>
    <rect y="18" width="300" height="14" class="box-vpn"/><text x="8" y="29" class="lbl-sm" fill="#dc2626"><tspan font-weight="700">Mode 2 (opt-in)</tspan> — Site-to-Site IPsec VPN</text>
    <rect y="36" width="300" height="14" class="box-ext"/><text x="8" y="47" class="lbl-sm" fill="#7c3aed">External API call</text>
  </g>

  <!-- LEFT: Hospital IT systems -->
  <rect x="20" y="120" width="400" height="640" class="group"/>
  <text x="40" y="142" class="title">Hospital IT systems</text>

  <rect x="40" y="160" width="370" height="90" class="box box-hosp"/>
  <text x="225" y="182" text-anchor="middle" class="title">EHR (Epic / Cerner / Allscripts)</text>
  <text x="225" y="202" text-anchor="middle" class="lbl-sm">FHIR R4 endpoint · SMART App Launch v2</text>
  <text x="225" y="218" text-anchor="middle" class="lbl-sm">Internet-reachable (modern) → Mode 1</text>
  <text x="225" y="236" text-anchor="middle" class="lbl-sm">On-prem only (legacy) → Mode 2 VPN</text>

  <rect x="40" y="260" width="370" height="80" class="box box-id"/>
  <text x="225" y="282" text-anchor="middle" class="title">Hospital IdP</text>
  <text x="225" y="300" text-anchor="middle" class="lbl-sm">Microsoft EntraID · Okta · ADFS · Keycloak</text>
  <text x="225" y="316" text-anchor="middle" class="lbl-sm">SAML 2.0 or OIDC · Internet-reachable</text>
  <text x="225" y="332" text-anchor="middle" class="lbl-sm">MFA enforced at IdP · both modes</text>

  <rect x="40" y="350" width="370" height="80" class="box box-hosp"/>
  <text x="225" y="372" text-anchor="middle" class="title">SharePoint / OneDrive</text>
  <text x="225" y="390" text-anchor="middle" class="lbl-sm">Online → Microsoft Graph API (Mode 1)</text>
  <text x="225" y="406" text-anchor="middle" class="lbl-sm">Server on-prem → VPN pull (Mode 2)</text>
  <text x="225" y="422" text-anchor="middle" class="lbl-sm">Sites.Selected scope · 30-day subs</text>

  <rect x="40" y="440" width="370" height="70" class="box box-hosp"/>
  <text x="225" y="462" text-anchor="middle" class="title">Other document systems</text>
  <text x="225" y="480" text-anchor="middle" class="lbl-sm">Google Drive (files.watch) · Confluence</text>
  <text x="225" y="496" text-anchor="middle" class="lbl-sm">On-prem NFS/SMB → Mode 2 scheduled puller</text>

  <rect x="40" y="520" width="370" height="80" class="box box-hosp"/>
  <text x="225" y="542" text-anchor="middle" class="title">Clinician workstations</text>
  <text x="225" y="560" text-anchor="middle" class="lbl-sm">Chrome 120+ / Edge 120+ / Safari 17+</text>
  <text x="225" y="576" text-anchor="middle" class="lbl-sm">Chat UI: always public HTTPS (both modes)</text>
  <text x="225" y="592" text-anchor="middle" class="lbl-sm">EHR iframe or standalone web app</text>

  <rect x="40" y="610" width="370" height="70" class="box box-hosp"/>
  <text x="225" y="632" text-anchor="middle" class="title">MS Teams (post-launch enhancement)</text>
  <text x="225" y="650" text-anchor="middle" class="lbl-sm">Teams Messaging Extension (search-based)</text>
  <text x="225" y="666" text-anchor="middle" class="lbl-sm">same auth + FHIR context pattern</text>

  <rect x="40" y="690" width="370" height="60" class="box box-vpn"/>
  <text x="225" y="712" text-anchor="middle" class="title">Customer Gateway (Mode 2 ONLY)</text>
  <text x="225" y="730" text-anchor="middle" class="lbl-sm">Existing firewall — IKEv2 AES-256-GCM</text>
  <text x="225" y="744" text-anchor="middle" class="lbl-sm">Skipped entirely in Mode 1</text>

  <!-- MIDDLE: Nova platform -->
  <rect x="440" y="120" width="520" height="640" class="group"/>
  <text x="460" y="142" class="title">Nova platform on Alibaba Cloud Singapore</text>

  <rect x="460" y="160" width="480" height="90" class="box box-saas"/>
  <text x="700" y="182" text-anchor="middle" class="title">CDN + WAF + API Gateway + IDaaS EIAM 2.0 Premium+</text>
  <text x="700" y="202" text-anchor="middle" class="lbl-sm">Public HTTPS + TLS 1.3 · IDaaS federates via SAML/OIDC to hospital IdP</text>
  <text x="700" y="218" text-anchor="middle" class="lbl-sm">WAF rules + Anti-DDoS + per-tenant IP allow-list (optional)</text>
  <text x="700" y="236" text-anchor="middle" class="lbl-sm">Session: 60 min clinician · 15 min admin · step-up MFA on admin:*</text>

  <rect x="460" y="260" width="480" height="80" class="box box-nova"/>
  <text x="700" y="282" text-anchor="middle" class="title">FC /chat — SMART on FHIR launch handler</text>
  <text x="700" y="300" text-anchor="middle" class="lbl-sm">Exchange launch ctx → FHIR patient bundle (Mode 1 calls EHR over public Internet)</text>
  <text x="700" y="316" text-anchor="middle" class="lbl-sm">Extract minimum slice · DataWorks SDDP mask before LLM call</text>
  <text x="700" y="332" text-anchor="middle" class="lbl-sm">(Mode 2 calls EHR FHIR over IPsec VPN)</text>

  <rect x="460" y="350" width="230" height="100" class="box box-nova"/>
  <text x="575" y="372" text-anchor="middle" class="title">Scopes requested</text>
  <text x="575" y="390" text-anchor="middle" class="lbl-sm">launch openid fhirUser</text>
  <text x="575" y="406" text-anchor="middle" class="lbl-sm">patient/Patient.rs</text>
  <text x="575" y="420" text-anchor="middle" class="lbl-sm">patient/Condition.rs</text>
  <text x="575" y="434" text-anchor="middle" class="lbl-sm">patient/MedicationStatement.rs</text>

  <rect x="705" y="350" width="235" height="100" class="box box-nova"/>
  <text x="820" y="372" text-anchor="middle" class="title">RBAC (at API GW + FC)</text>
  <text x="820" y="390" text-anchor="middle" class="lbl-sm">chat:clinical (clinician)</text>
  <text x="820" y="406" text-anchor="middle" class="lbl-sm">curator:upload (data curator)</text>
  <text x="820" y="420" text-anchor="middle" class="lbl-sm">kb:read (admin, audit-logged)</text>
  <text x="820" y="434" text-anchor="middle" class="lbl-sm">admin:* (break-glass 2-person)</text>

  <rect x="460" y="460" width="480" height="80" class="box box-saas"/>
  <text x="700" y="482" text-anchor="middle" class="title">FC webhook — Microsoft Graph subscriptions (Mode 1)</text>
  <text x="700" y="502" text-anchor="middle" class="lbl-sm">POST /webhooks/graph · validates clientState secret</text>
  <text x="700" y="518" text-anchor="middle" class="lbl-sm">Event → OSS /raw/sharepoint/&lt;tenant&gt;/ → ingestion Workflow</text>
  <text x="700" y="534" text-anchor="middle" class="lbl-sm">All via public Internet; no VPN</text>

  <rect x="460" y="550" width="480" height="70" class="box box-saas"/>
  <text x="700" y="572" text-anchor="middle" class="title">SAE container — Upload Portal</text>
  <text x="700" y="590" text-anchor="middle" class="lbl-sm">Curator UI · OIDC to hospital IdP · presigned OSS PUT</text>
  <text x="700" y="606" text-anchor="middle" class="lbl-sm">Mode 1: public HTTPS + IP allow-list · Mode 2: over VPN</text>

  <rect x="460" y="630" width="480" height="80" class="box box-vpn"/>
  <text x="700" y="652" text-anchor="middle" class="title">VPN Gateway (Mode 2 only)</text>
  <text x="700" y="670" text-anchor="middle" class="lbl-sm">IPsec-VPN · terminates hospital tunnel · 100 Mbps tier</text>
  <text x="700" y="686" text-anchor="middle" class="lbl-sm">Carries on-prem EHR FHIR / SharePoint Server / SMB pull</text>
  <text x="700" y="702" text-anchor="middle" class="lbl-sm">Clinician chat NEVER traverses VPN — always public HTTPS</text>

  <rect x="460" y="720" width="480" height="35" class="box"/>
  <text x="700" y="742" text-anchor="middle" class="title">Staff identity — Cloud SSO + RAM federated to Nova EntraID</text>

  <!-- RIGHT: External APIs + staff -->
  <rect x="980" y="120" width="370" height="640" class="group"/>
  <text x="1000" y="142" class="title">External APIs &amp; Nova staff</text>

  <rect x="1000" y="160" width="340" height="110" class="box box-ext"/>
  <text x="1170" y="182" text-anchor="middle" class="title">WHO ICD-11 API</text>
  <text x="1170" y="202" text-anchor="middle" class="lbl-sm">Registered OAuth2 client</text>
  <text x="1170" y="218" text-anchor="middle" class="lbl-sm">icd.who.int/icdapi · public Internet</text>
  <text x="1170" y="234" text-anchor="middle" class="lbl-sm">(1) daily delta ingest</text>
  <text x="1170" y="250" text-anchor="middle" class="lbl-sm">(2) runtime tool (3) query expansion</text>

  <rect x="1000" y="280" width="340" height="90" class="box box-ext"/>
  <text x="1170" y="302" text-anchor="middle" class="title">NCBI PubMed E-utilities</text>
  <text x="1170" y="322" text-anchor="middle" class="lbl-sm">eutils.ncbi.nlm.nih.gov · public</text>
  <text x="1170" y="338" text-anchor="middle" class="lbl-sm">Free: 3 req/s · API key: 10 req/s</text>
  <text x="1170" y="354" text-anchor="middle" class="lbl-sm">No preemptive ingest</text>

  <rect x="1000" y="380" width="340" height="90" class="box box-ext"/>
  <text x="1170" y="402" text-anchor="middle" class="title">Microsoft Graph API</text>
  <text x="1170" y="422" text-anchor="middle" class="lbl-sm">graph.microsoft.com · public HTTPS</text>
  <text x="1170" y="438" text-anchor="middle" class="lbl-sm">Sites.Selected scope · 30-day subs</text>
  <text x="1170" y="454" text-anchor="middle" class="lbl-sm">Used for SharePoint Online (Mode 1)</text>

  <rect x="1000" y="480" width="340" height="100" class="box box-ext"/>
  <text x="1170" y="502" text-anchor="middle" class="title">Credentials Manager secrets</text>
  <text x="1170" y="522" text-anchor="middle" class="lbl-sm">WHO OAuth (90-day rotation)</text>
  <text x="1170" y="538" text-anchor="middle" class="lbl-sm">Graph app secret (90-day)</text>
  <text x="1170" y="554" text-anchor="middle" class="lbl-sm">Model Studio API keys (60-day)</text>
  <text x="1170" y="570" text-anchor="middle" class="lbl-sm">VPN PSK (Mode 2 tenants only)</text>

  <rect x="1000" y="590" width="340" height="80" class="box"/>
  <text x="1170" y="612" text-anchor="middle" class="title">Nova staff</text>
  <text x="1170" y="630" text-anchor="middle" class="lbl-sm">Nova EntraID tenant</text>
  <text x="1170" y="648" text-anchor="middle" class="lbl-sm">SRE · Compliance · Architects</text>
  <text x="1170" y="664" text-anchor="middle" class="lbl-sm">Federated via Cloud SSO + RAM</text>

  <rect x="1000" y="680" width="340" height="70" class="box box-ext"/>
  <text x="1170" y="702" text-anchor="middle" class="title">NAT Gateway (egress allow-list)</text>
  <text x="1170" y="720" text-anchor="middle" class="lbl-sm">WHO + NCBI + Graph only</text>
  <text x="1170" y="736" text-anchor="middle" class="lbl-sm">Everything else denied at VPC</text>

  <!-- ARROWS - MODE 1 (public HTTPS, green) -->
  <!-- Clinician/EHR iframe → Nova edge -->
  <path d="M410 205 L460 200" class="edge-saas" marker-end="url(#arr-saas)"/>
  <text x="435" y="195" text-anchor="middle" class="lbl-sm" fill="#16a34a">SMART on FHIR (public)</text>

  <!-- Hospital IdP ↔ IDaaS federation -->
  <path d="M410 300 L460 210" class="edge-saas" marker-end="url(#arr-saas)"/>
  <text x="435" y="295" class="lbl-sm" fill="#16a34a">SAML/OIDC fed.</text>

  <!-- SharePoint Online → Graph webhook (Mode 1) -->
  <path d="M410 390 L460 490" class="edge-saas" marker-end="url(#arr-saas)"/>
  <text x="420" y="470" class="lbl-sm" fill="#16a34a">Graph subscription</text>

  <!-- Clinician browser → Nova web app -->
  <path d="M410 560 Q430 560 460 250" class="edge-saas" marker-end="url(#arr-saas)"/>

  <!-- MODE 2 VPN (dashed red) -->
  <path d="M410 720 L460 680" class="edge-vpn" marker-end="url(#arr-vpn)"/>
  <text x="412" y="710" class="lbl-sm" fill="#dc2626">IPsec tunnel</text>

  <!-- FC → on-prem EHR FHIR (Mode 2 callback path via VPN) -->
  <path d="M460 300 Q380 310 380 680 L410 700" class="edge-vpn" marker-end="url(#arr-vpn)"/>
  <text x="355" y="500" class="lbl-sm" fill="#dc2626">Mode 2 only:</text>
  <text x="355" y="515" class="lbl-sm" fill="#dc2626">FHIR over VPN</text>

  <!-- External APIs purple arrows -->
  <path d="M940 215 Q970 190 1000 210" class="edge-ext" marker-end="url(#arr-ext)"/>
  <text x="975" y="170" class="lbl-sm" fill="#7c3aed">ingest + runtime tool</text>
  <path d="M940 310 L1000 325" class="edge-ext" marker-end="url(#arr-ext)"/>
  <text x="970" y="308" class="lbl-sm" fill="#7c3aed">agent tool</text>
  <path d="M940 500 L1000 425" class="edge-ext" marker-end="url(#arr-ext)"/>
  <text x="970" y="475" class="lbl-sm" fill="#7c3aed">webhook subscribe</text>

  <!-- NAT Gateway gate -->
  <path d="M1000 210 Q970 440 970 700" class="edge" marker-end="url(#arr)"/>
  <path d="M1000 325 Q970 500 970 700" class="edge" marker-end="url(#arr)"/>
  <path d="M1000 425 Q970 550 970 700" class="edge" marker-end="url(#arr)"/>

  <!-- Credentials Manager → FC -->
  <path d="M1000 530 L940 340" class="edge" marker-end="url(#arr)"/>
  <text x="975" y="415" class="lbl-sm">retrieve at cold start</text>

  <!-- Nova staff → Cloud SSO -->
  <path d="M1000 635 L940 740" class="edge" marker-end="url(#arr)"/>
</svg>
