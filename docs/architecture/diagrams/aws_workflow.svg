<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .box      { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.2; rx:8; ry:8; }
      .box-aws  { fill:#fff7ed; stroke:#fb923c; }
      .box-svc  { fill:#eff6ff; stroke:#60a5fa; }
      .box-user { fill:#f0fdf4; stroke:#4ade80; }
      .box-data { fill:#fefce8; stroke:#facc15; }
      .box-ext  { fill:#faf5ff; stroke:#c084fc; }
      .box-em   { fill:#fef2f2; stroke:#dc2626; stroke-width:1.5; }
      .box-cp   { fill:#eff6ff; stroke:#1d4ed8; stroke-width:1.5; }
      .group    { fill:#f8fafc; stroke:#94a3b8; stroke-dasharray:4 3; rx:12; ry:12; }
      .title    { font-weight:700; }
      .lbl      { fill:#334155; }
      .lbl-sm   { fill:#64748b; font-size:10.5px; }
      .step     { fill:#0ea5e9; }
      .step-text{ fill:#ffffff; font-weight:700; font-size:11px; }
      .edge     { stroke:#64748b; stroke-width:1.3; fill:none; }
      .edge-em  { stroke:#dc2626; stroke-width:1.8; fill:none; }
      .edge-cp  { stroke:#1d4ed8; stroke-width:1.8; fill:none; }
      .edge-dash{ stroke:#64748b; stroke-width:1.2; fill:none; stroke-dasharray:5 3; }
    </style>
  </defs>

  <!-- Title -->
  <text x="640" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">
    Nova Health Tech — Clinical GenAI (AWS Singapore, ap-southeast-1)
  </text>
  <text x="640" y="44" text-anchor="middle" font-size="12" fill="#64748b">
    Emergency toggle (explicit if/else) · LangGraph orchestration · Bedrock + OpenSearch KB · Site-to-Site VPN for internal data
  </text>

  <!-- ======================= LEFT: Hospital ======================= -->
  <rect x="20" y="70" width="270" height="260" class="group"/>
  <text x="40" y="92" class="title">Hospital network</text>

  <rect x="40" y="110" width="230" height="50" class="box box-user"/>
  <text x="155" y="130" text-anchor="middle" class="title">Clinician browser</text>
  <text x="155" y="146" text-anchor="middle" class="lbl-sm">HTTPS · EntraID OIDC · Emergency toggle</text>

  <rect x="40" y="180" width="230" height="50" class="box box-user"/>
  <text x="155" y="200" text-anchor="middle" class="title">EHR (Epic / Cerner)</text>
  <text x="155" y="216" text-anchor="middle" class="lbl-sm">SMART App Launch v2 · FHIR R4</text>

  <rect x="40" y="250" width="230" height="60" class="box box-user"/>
  <text x="155" y="270" text-anchor="middle" class="title">Internal systems</text>
  <text x="155" y="286" text-anchor="middle" class="lbl-sm">SharePoint / file shares / clinical ops portal</text>
  <text x="155" y="302" text-anchor="middle" class="lbl-sm">(reached via Site-to-Site VPN)</text>

  <!-- ======================= RIGHT: AWS ======================= -->
  <rect x="310" y="70" width="950" height="600" class="group"/>
  <text x="330" y="92" class="title">AWS Singapore — ap-southeast-1 (VPC isolated)</text>

  <!-- Edge: CloudFront + WAF + API GW + Cognito -->
  <rect x="330" y="110" width="215" height="70" class="box box-aws"/>
  <text x="437" y="130" text-anchor="middle" class="title">CloudFront + WAF</text>
  <text x="437" y="146" text-anchor="middle" class="lbl-sm">TLS 1.3 · geo/rate rules</text>
  <text x="437" y="162" text-anchor="middle" class="lbl-sm">API Gateway · Cognito JWT authorizer</text>

  <!-- chat Lambda -->
  <rect x="330" y="205" width="215" height="140" class="box box-aws"/>
  <text x="437" y="224" text-anchor="middle" class="title">Lambda /chat (VPC)</text>
  <text x="340" y="246" class="lbl-sm">• authn (Cognito)</text>
  <text x="340" y="263" class="lbl-sm">• PHI mask (Comprehend Medical)</text>
  <text x="340" y="280" class="lbl-sm">• read `emergency` flag from body</text>
  <text x="340" y="297" class="lbl-sm">• LangGraph: retrieve → route</text>
  <text x="340" y="314" class="lbl-sm">• if-else (no classifier call)</text>
  <text x="340" y="331" class="lbl-sm">• audit log to CloudTrail</text>

  <!-- Caches -->
  <rect x="330" y="365" width="215" height="80" class="box box-aws"/>
  <text x="437" y="384" text-anchor="middle" class="title">Caching (3 layers)</text>
  <text x="340" y="403" class="lbl-sm">• ElastiCache Valkey — semantic</text>
  <text x="340" y="419" class="lbl-sm">• Bedrock Prompt Cache — 90% off</text>
  <text x="340" y="435" class="lbl-sm">• Reserved Tier — peak-hour capacity</text>

  <!-- Retrieval -->
  <rect x="580" y="205" width="230" height="140" class="box box-svc"/>
  <text x="695" y="224" text-anchor="middle" class="title">Bedrock Knowledge Bases</text>
  <text x="590" y="246" class="lbl-sm">• kb-who-guidelines</text>
  <text x="590" y="263" class="lbl-sm">• kb-internal-trials</text>
  <text x="590" y="280" class="lbl-sm">• kb-treatment-protocols</text>
  <text x="590" y="297" class="lbl-sm">• kb-icd11</text>
  <text x="590" y="314" class="lbl-sm">on OpenSearch Serverless (HNSW+BM25)</text>
  <text x="590" y="331" class="lbl-sm">+ Cohere Embed v4 · Nova MM Embed (figs)</text>

  <!-- Bedrock models -->
  <rect x="850" y="205" width="190" height="60" class="box box-em"/>
  <text x="945" y="224" text-anchor="middle" class="title" fill="#dc2626">Claude Haiku 4.5</text>
  <text x="945" y="240" text-anchor="middle" class="lbl-sm">EMERGENCY · temperature 0.1</text>
  <text x="945" y="255" text-anchor="middle" class="lbl-sm">target ≤ 2 s</text>

  <rect x="850" y="285" width="190" height="60" class="box box-cp"/>
  <text x="945" y="304" text-anchor="middle" class="title" fill="#1d4ed8">Claude Sonnet 4.5</text>
  <text x="945" y="320" text-anchor="middle" class="lbl-sm">COMPLEX · temperature 0.2</text>
  <text x="945" y="335" text-anchor="middle" class="lbl-sm">target 3–6 s</text>

  <!-- Guardrails -->
  <rect x="1080" y="205" width="160" height="140" class="box box-svc"/>
  <text x="1160" y="224" text-anchor="middle" class="title">Bedrock Guardrails</text>
  <text x="1090" y="246" class="lbl-sm">• PHI filter</text>
  <text x="1090" y="263" class="lbl-sm">• Denied topics</text>
  <text x="1090" y="280" class="lbl-sm">• Grounding ≥ 0.7</text>
  <text x="1090" y="297" class="lbl-sm">• Prompt-injection</text>
  <text x="1090" y="314" class="lbl-sm">Block + log on fail</text>
  <text x="1090" y="331" class="lbl-sm">Citation validator</text>

  <!-- Ingestion pipeline -->
  <rect x="580" y="365" width="460" height="80" class="box box-svc"/>
  <text x="810" y="384" text-anchor="middle" class="title">Ingestion pipeline (Step Functions)</text>
  <text x="810" y="403" text-anchor="middle" class="lbl-sm">EventBridge cron → BDA advanced parse → chunker → embed → KB sync</text>
  <text x="810" y="419" text-anchor="middle" class="lbl-sm">+ GuardDuty Malware Protection · Macie PHI scan</text>
  <text x="810" y="435" text-anchor="middle" class="lbl-sm">ICD-11 daily · WHO monthly · SharePoint webhooks · manual portal</text>

  <!-- S3 -->
  <rect x="580" y="470" width="210" height="70" class="box box-data"/>
  <text x="685" y="490" text-anchor="middle" class="title">S3 raw bucket (KMS)</text>
  <text x="685" y="506" text-anchor="middle" class="lbl-sm">raw/scheduled, raw/manual,</text>
  <text x="685" y="522" text-anchor="middle" class="lbl-sm">raw/icd11, raw/sharepoint</text>

  <!-- Upload portal -->
  <rect x="810" y="470" width="230" height="70" class="box box-aws"/>
  <text x="925" y="490" text-anchor="middle" class="title">Internal Upload Portal</text>
  <text x="925" y="506" text-anchor="middle" class="lbl-sm">Private ALB · ECS Fargate</text>
  <text x="925" y="522" text-anchor="middle" class="lbl-sm">Hospital-VPN-only · IdP-auth</text>

  <!-- Site-to-Site VPN -->
  <rect x="1060" y="470" width="180" height="70" class="box box-aws"/>
  <text x="1150" y="490" text-anchor="middle" class="title">VPN Gateway</text>
  <text x="1150" y="506" text-anchor="middle" class="lbl-sm">IPsec IKEv2 · AES-256-GCM</text>
  <text x="1150" y="522" text-anchor="middle" class="lbl-sm">Dual-tunnel HA</text>

  <!-- Audit -->
  <rect x="580" y="560" width="460" height="80" class="box box-svc"/>
  <text x="810" y="580" text-anchor="middle" class="title">Audit + log retention (6 years, HIPAA §164.530(j))</text>
  <text x="810" y="599" text-anchor="middle" class="lbl-sm">CloudTrail · Bedrock invocation logs · Macie findings</text>
  <text x="810" y="615" text-anchor="middle" class="lbl-sm">→ S3 Object Lock WORM → Security Lake → SIEM export</text>

  <!-- ============== EXTERNAL SOURCES ============== -->
  <rect x="20" y="700" width="1240" height="150" class="group"/>
  <text x="40" y="722" class="title">External sources polled by scheduled ingestion</text>

  <rect x="40"  y="740" width="200" height="90" class="box box-ext"/>
  <text x="140" y="760" text-anchor="middle" class="title">WHO ICD-11 API</text>
  <text x="140" y="778" text-anchor="middle" class="lbl-sm">id.who.int/swagger</text>
  <text x="140" y="796" text-anchor="middle" class="lbl-sm">OAuth2 client-credentials</text>
  <text x="140" y="814" text-anchor="middle" class="lbl-sm">daily delta + full walk</text>

  <rect x="260" y="740" width="200" height="90" class="box box-ext"/>
  <text x="360" y="760" text-anchor="middle" class="title">WHO guideline PDFs</text>
  <text x="360" y="778" text-anchor="middle" class="lbl-sm">publications RSS</text>
  <text x="360" y="796" text-anchor="middle" class="lbl-sm">monthly + living guidelines</text>
  <text x="360" y="814" text-anchor="middle" class="lbl-sm">100+ page, tables, figures</text>

  <rect x="480" y="740" width="220" height="90" class="box box-ext"/>
  <text x="590" y="760" text-anchor="middle" class="title">Microsoft Graph</text>
  <text x="590" y="778" text-anchor="middle" class="lbl-sm">SharePoint subscriptions</text>
  <text x="590" y="796" text-anchor="middle" class="lbl-sm">create/update/delete webhooks</text>
  <text x="590" y="814" text-anchor="middle" class="lbl-sm">Sites.Selected app perm</text>

  <rect x="720" y="740" width="230" height="90" class="box box-ext"/>
  <text x="835" y="760" text-anchor="middle" class="title">Internal trial reports</text>
  <text x="835" y="778" text-anchor="middle" class="lbl-sm">weekly batch pull over VPN</text>
  <text x="835" y="796" text-anchor="middle" class="lbl-sm">+ manual portal override</text>
  <text x="835" y="814" text-anchor="middle" class="lbl-sm">legacy PDFs, inconsistent tags</text>

  <rect x="970" y="740" width="270" height="90" class="box box-ext"/>
  <text x="1105" y="760" text-anchor="middle" class="title">Treatment protocols</text>
  <text x="1105" y="778" text-anchor="middle" class="lbl-sm">weekly batch pull over VPN</text>
  <text x="1105" y="796" text-anchor="middle" class="lbl-sm">+ manual portal override</text>
  <text x="1105" y="814" text-anchor="middle" class="lbl-sm">reviewed/approved protocols</text>

  <!-- ============== EDGES (numbered flow) ============== -->

  <!-- 1: browser → CloudFront -->
  <path d="M 270 135 L 330 135" class="edge" marker-end="url(#arrow)"/>
  <circle cx="300" cy="135" r="10" class="step"/>
  <text x="300" y="139" text-anchor="middle" class="step-text">1</text>

  <!-- 2: CloudFront → Lambda -->
  <path d="M 437 180 L 437 205" class="edge" marker-end="url(#arrow)"/>
  <circle cx="420" cy="192" r="10" class="step"/>
  <text x="420" y="196" text-anchor="middle" class="step-text">2</text>

  <!-- 3: Lambda → Cache -->
  <path d="M 437 345 L 437 365" class="edge-dash" marker-end="url(#arrow)"/>
  <circle cx="420" cy="356" r="10" class="step"/>
  <text x="420" y="360" text-anchor="middle" class="step-text">3</text>

  <!-- 4: Lambda → KB retrieve -->
  <path d="M 545 260 L 580 260" class="edge" marker-end="url(#arrow)"/>
  <circle cx="562" cy="260" r="10" class="step"/>
  <text x="562" y="264" text-anchor="middle" class="step-text">4</text>

  <!-- 5a emergency: Lambda → Haiku (red) -->
  <path d="M 545 275 C 690 275, 740 235, 850 235" class="edge-em" marker-end="url(#arrow-red)"/>
  <circle cx="688" cy="246" r="10" fill="#dc2626"/>
  <text x="688" y="250" text-anchor="middle" class="step-text">5a</text>

  <!-- 5b complex: Lambda → Sonnet (blue) -->
  <path d="M 545 300 C 680 300, 740 315, 850 315" class="edge-cp" marker-end="url(#arrow-blue)"/>
  <circle cx="688" cy="316" r="10" fill="#1d4ed8"/>
  <text x="688" y="320" text-anchor="middle" class="step-text">5b</text>

  <!-- 6: Model → Guardrails -->
  <path d="M 1040 235 L 1080 235" class="edge" marker-end="url(#arrow)"/>
  <path d="M 1040 315 C 1060 315, 1060 260, 1080 260" class="edge" marker-end="url(#arrow)"/>
  <circle cx="1060" cy="240" r="10" class="step"/>
  <text x="1060" y="244" text-anchor="middle" class="step-text">6</text>

  <!-- 7: Guardrails → back to Lambda → user -->
  <path d="M 1160 345 C 1160 400, 500 400, 437 345" class="edge" marker-end="url(#arrow)"/>
  <circle cx="900" cy="390" r="10" class="step"/>
  <text x="900" y="394" text-anchor="middle" class="step-text">7</text>

  <!-- 8: Lambda → audit -->
  <path d="M 437 445 C 437 480, 650 480, 780 560" class="edge-dash" marker-end="url(#arrow)"/>
  <circle cx="600" cy="485" r="10" class="step"/>
  <text x="600" y="489" text-anchor="middle" class="step-text">8</text>

  <!-- Ingestion flow numbers 9 -->
  <!-- External → S3 via pipeline -->
  <path d="M 140 740 C 140 700, 685 690, 685 470" class="edge-dash" marker-end="url(#arrow)"/>
  <path d="M 360 740 C 360 690, 685 690, 685 470" class="edge-dash" marker-end="url(#arrow)"/>
  <path d="M 590 740 C 590 690, 685 690, 685 470" class="edge-dash" marker-end="url(#arrow)"/>
  <path d="M 835 740 C 835 690, 685 690, 685 470" class="edge-dash" marker-end="url(#arrow)"/>
  <path d="M 1105 740 C 1105 690, 685 690, 685 470" class="edge-dash" marker-end="url(#arrow)"/>

  <circle cx="685" cy="665" r="11" class="step"/>
  <text x="685" y="669" text-anchor="middle" class="step-text">9</text>

  <!-- S3 → ingestion pipeline -->
  <path d="M 685 470 L 685 445" class="edge" marker-end="url(#arrow)"/>
  <!-- ingestion pipeline → KB -->
  <path d="M 810 365 L 810 345" class="edge" marker-end="url(#arrow)"/>
  <circle cx="810" cy="355" r="10" class="step"/>
  <text x="810" y="359" text-anchor="middle" class="step-text">10</text>

  <!-- Hospital systems → VPN -->
  <path d="M 270 280 C 900 280, 1150 400, 1150 470" class="edge-dash" marker-end="url(#arrow)"/>
  <!-- Upload portal via VPN -->
  <path d="M 1150 470 L 925 470" class="edge" marker-end="url(#arrow)"/>
  <!-- Upload portal → S3 -->
  <path d="M 810 505 L 790 505" class="edge" marker-end="url(#arrow)"/>

  <!-- ====== LEGEND ====== -->
  <rect x="20" y="862" width="1240" height="48" class="group"/>
  <text x="40" y="882" class="title">Workflow steps</text>
  <text x="40" y="900" class="lbl-sm">
    1 browser → edge · 2 JWT auth · 3 semantic cache check · 4 hybrid retrieval · 5a/5b if-else emergency=true → Haiku else Sonnet · 6 guardrail + citation check · 7 stream back to user · 8 audit log · 9 scheduled ingest · 10 chunk+embed+index
  </text>
</svg>
