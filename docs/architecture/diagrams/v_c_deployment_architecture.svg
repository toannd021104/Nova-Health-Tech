<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 860" font-family="-apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="arr-cicd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <style>
      .box       { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.2; rx:8; ry:8; }
      .box-az    { fill:#eff6ff; stroke:#60a5fa; stroke-width:1.5; }
      .box-svc   { fill:#f0fdf4; stroke:#4ade80; }
      .box-ali   { fill:#fff7ed; stroke:#fb923c; }
      .box-data  { fill:#fefce8; stroke:#facc15; }
      .box-dr    { fill:#fef2f2; stroke:#dc2626; stroke-dasharray:4 3; }
      .box-ci    { fill:#f5f3ff; stroke:#7c3aed; }
      .group     { fill:#f8fafc; stroke:#94a3b8; stroke-dasharray:4 3; stroke-width:1.2; rx:12; ry:12; }
      .region    { fill:none; stroke:#fb923c; stroke-width:2; stroke-dasharray:8 3; rx:10; ry:10; }
      .title     { font-weight:700; fill:#0f172a; }
      .lbl-sm    { fill:#64748b; font-size:10.5px; }
      .edge      { stroke:#64748b; stroke-width:1.3; fill:none; }
      .edge-p    { stroke:#1d4ed8; stroke-width:1.6; fill:none; }
      .edge-cicd { stroke:#16a34a; stroke-width:1.8; fill:none; stroke-dasharray:5 3; }
      .edge-dr   { stroke:#dc2626; stroke-width:1.6; fill:none; stroke-dasharray:5 3; }
    </style>
  </defs>

  <text x="680" y="28" text-anchor="middle" font-size="17" class="title">Deployment Architecture — Single Region, Multi-AZ, Serverless-First, SaaS-default (§9)</text>
  <text x="680" y="48" text-anchor="middle" class="lbl-sm">Hospitals onboard via public HTTPS (Mode 1 baseline) · Site-to-Site IPsec VPN is Mode 2 opt-in for on-prem-only EHR/file shares · No Outposts/Direct Connect/Apsara Stack</text>

  <!-- HOSPITAL side -->
  <rect x="20" y="80" width="240" height="460" class="group"/>
  <text x="40" y="102" class="title">Hospital network</text>

  <rect x="40" y="120" width="200" height="60" class="box"/>
  <text x="140" y="142" text-anchor="middle" class="title">Clinician workstations</text>
  <text x="140" y="160" text-anchor="middle" class="lbl-sm">Chrome/Edge/Safari</text>
  <text x="140" y="174" text-anchor="middle" class="lbl-sm">Browser-first · mobile roadmap</text>

  <rect x="40" y="200" width="200" height="60" class="box"/>
  <text x="140" y="222" text-anchor="middle" class="title">Existing EHR</text>
  <text x="140" y="240" text-anchor="middle" class="lbl-sm">Epic / Cerner / Allscripts</text>
  <text x="140" y="254" text-anchor="middle" class="lbl-sm">FHIR R4 + SMART v2</text>

  <rect x="40" y="280" width="200" height="60" class="box"/>
  <text x="140" y="302" text-anchor="middle" class="title">Existing IdP</text>
  <text x="140" y="320" text-anchor="middle" class="lbl-sm">EntraID / Okta / ADFS</text>
  <text x="140" y="334" text-anchor="middle" class="lbl-sm">SAML 2.0 / OIDC · MFA</text>

  <rect x="40" y="360" width="200" height="60" class="box"/>
  <text x="140" y="382" text-anchor="middle" class="title">SharePoint / OneDrive</text>
  <text x="140" y="400" text-anchor="middle" class="lbl-sm">Microsoft Graph</text>
  <text x="140" y="414" text-anchor="middle" class="lbl-sm">Sites.Selected scope</text>

  <rect x="40" y="440" width="200" height="60" class="box"/>
  <text x="140" y="462" text-anchor="middle" class="title">Mode 2 — Customer Gateway</text>
  <text x="140" y="480" text-anchor="middle" class="lbl-sm">Optional: existing firewall</text>
  <text x="140" y="494" text-anchor="middle" class="lbl-sm">for on-prem-only EHR/SharePoint</text>

  <text x="140" y="525" text-anchor="middle" class="lbl-sm">↑ Mode 1 (baseline): public HTTPS,</text>
  <text x="140" y="538" text-anchor="middle" class="lbl-sm">   no Nova-specific install on-prem</text>

  <!-- ALIBABA CLOUD region block -->
  <rect x="280" y="80" width="820" height="680" class="region"/>
  <text x="690" y="100" text-anchor="middle" class="title" fill="#fb923c">Alibaba Cloud — Singapore International (ap-southeast-1)</text>
  <text x="690" y="116" text-anchor="middle" class="lbl-sm">Primary single-region · PDPA-native · ISO 27001/17/18/27701, SOC 1/2/3</text>

  <!-- Edge tier -->
  <rect x="300" y="130" width="780" height="60" class="box box-ali"/>
  <text x="320" y="150" class="title">Edge tier</text>
  <text x="320" y="170" class="lbl-sm">CDN · Anti-DDoS · WAF (TLS 1.3) · API Gateway · IDaaS EIAM 2.0 (hospital-IdP SAML/OIDC federation) · optional per-tenant IP allow-list</text>

  <!-- Compute tier -->
  <rect x="300" y="200" width="780" height="110" class="box box-svc"/>
  <text x="320" y="220" class="title">Compute tier — serverless-first</text>
  <text x="320" y="244" class="lbl-sm">• Function Compute 3.0 (fc-open) — /chat runtime in private-app VPC · scale-to-zero · pre-provisioned warm for emergency</text>
  <text x="320" y="262" class="lbl-sm">• Function Workflow — ingestion state machine · concurrency cap 50 respects Model Studio RPM</text>
  <text x="320" y="280" class="lbl-sm">• SAE (Serverless App Engine) container — Upload Portal internal web app</text>
  <text x="320" y="298" class="lbl-sm">• ACK optional — client-managed K8s footprint on request (not baseline) · $400–600/mo vs $90 baseline</text>

  <!-- AI tier -->
  <rect x="300" y="320" width="780" height="110" class="box box-ali"/>
  <text x="320" y="340" class="title">AI tier</text>
  <text x="320" y="364" class="lbl-sm">• Model Studio (Bailian / dashscope-intl) — Qwen3.5-Flash · Qwen3.5-Plus · Qwen3-VL-Plus · Qwen3-rerank · embeddings</text>
  <text x="320" y="382" class="lbl-sm">• PAI-EAS — Qwen3-8B student (complex lane, ~60% of traffic) · A10 GPU · vLLM · PagedAttention · always-on · DR fallback for emergency</text>
  <text x="320" y="400" class="lbl-sm">• PAI DLC + Model Gallery — training jobs · SFT + LoRA + DPO + GRPO · quarterly cadence</text>
  <text x="320" y="418" class="lbl-sm">• PAI AI-Node (same VPC) — provides LLM egress for GraphRAG extraction</text>

  <!-- Data tier — MULTI-AZ -->
  <rect x="300" y="440" width="780" height="170" class="box box-az"/>
  <text x="320" y="460" class="title">Data tier — Multi-AZ</text>

  <rect x="320" y="475" width="230" height="120" class="box box-data"/>
  <text x="435" y="495" text-anchor="middle" class="title">OpenSearch Vector</text>
  <text x="435" y="513" text-anchor="middle" class="lbl-sm">Search HA — dual-zone</text>
  <text x="435" y="529" text-anchor="middle" class="lbl-sm">(Zone B + Zone C)</text>
  <text x="435" y="549" text-anchor="middle" class="lbl-sm">RPO ~5 min · RTO ~10 min</text>
  <text x="435" y="569" text-anchor="middle" class="lbl-sm">Hybrid BM25 + kNN</text>
  <text x="435" y="585" text-anchor="middle" class="lbl-sm">KMS BYOK encryption</text>

  <rect x="565" y="475" width="240" height="120" class="box box-data"/>
  <text x="685" y="495" text-anchor="middle" class="title">AnalyticDB for PG</text>
  <text x="685" y="513" text-anchor="middle" class="lbl-sm">3-zone instance (SG)</text>
  <text x="685" y="529" text-anchor="middle" class="lbl-sm">adbpg_graphrag extension</text>
  <text x="685" y="549" text-anchor="middle" class="lbl-sm">(engine ≥ 7.2.1.4)</text>
  <text x="685" y="569" text-anchor="middle" class="lbl-sm">Daily snapshot backup</text>
  <text x="685" y="585" text-anchor="middle" class="lbl-sm">RPO ~1 hr · RTO ~30 min</text>

  <rect x="820" y="475" width="240" height="120" class="box box-data"/>
  <text x="940" y="495" text-anchor="middle" class="title">Tair + OSS</text>
  <text x="940" y="513" text-anchor="middle" class="lbl-sm">Tair — 3-zone MAZ combo</text>
  <text x="940" y="529" text-anchor="middle" class="lbl-sm">rebuilds from source on miss</text>
  <text x="940" y="549" text-anchor="middle" class="lbl-sm">OSS raw + WORM audit —</text>
  <text x="940" y="565" text-anchor="middle" class="lbl-sm">cross-zone replication SG</text>
  <text x="940" y="581" text-anchor="middle" class="lbl-sm">RPO 0 · RTO ~15 min</text>

  <!-- Security + Observability -->
  <rect x="300" y="620" width="380" height="130" class="box"/>
  <text x="320" y="640" class="title">Security + Identity</text>
  <text x="320" y="660" class="lbl-sm">• KMS BYOK + Credentials Manager (60–90d rotation)</text>
  <text x="320" y="678" class="lbl-sm">• Content Moderation 2.0 (green API) · DataWorks SDDP</text>
  <text x="320" y="696" class="lbl-sm">• Security Center malware scan on ingest</text>
  <text x="320" y="714" class="lbl-sm">• RAM roles · Cloud SSO to Nova EntraID</text>
  <text x="320" y="732" class="lbl-sm">• PrivateLink to Model Studio · no public egress</text>

  <rect x="700" y="620" width="380" height="130" class="box box-ci"/>
  <text x="720" y="640" class="title">Observability + Audit</text>
  <text x="720" y="660" class="lbl-sm">• ActionTrail (control plane) → SLS → OSS WORM 6-yr</text>
  <text x="720" y="678" class="lbl-sm">• ARMS LLM Trace Explorer (OpenTelemetry spans)</text>
  <text x="720" y="696" class="lbl-sm">• DataV compliance dashboards</text>
  <text x="720" y="714" class="lbl-sm">• SLO alerting · cache hit rate · guardrail block rate</text>
  <text x="720" y="732" class="lbl-sm">• SIEM export nightly to hospital tenant</text>

  <!-- RIGHT column: CI/CD + DR -->
  <rect x="1120" y="80" width="230" height="680" class="group"/>
  <text x="1140" y="102" class="title">CI/CD + Operations</text>

  <rect x="1140" y="120" width="190" height="180" class="box box-ci"/>
  <text x="1235" y="142" text-anchor="middle" class="title">Code CI/CD</text>
  <text x="1235" y="162" text-anchor="middle" class="lbl-sm">GitHub → GH Actions</text>
  <text x="1235" y="178" text-anchor="middle" class="lbl-sm">↓</text>
  <text x="1235" y="194" text-anchor="middle" class="lbl-sm">ruff · mypy · pytest</text>
  <text x="1235" y="208" text-anchor="middle" class="lbl-sm">security scans</text>
  <text x="1235" y="224" text-anchor="middle" class="lbl-sm">↓</text>
  <text x="1235" y="240" text-anchor="middle" class="lbl-sm">aliyun → staging</text>
  <text x="1235" y="256" text-anchor="middle" class="lbl-sm">integration tests</text>
  <text x="1235" y="272" text-anchor="middle" class="lbl-sm">↓ manual approval</text>
  <text x="1235" y="288" text-anchor="middle" class="lbl-sm">aliyun → production</text>

  <rect x="1140" y="320" width="190" height="180" class="box box-ci"/>
  <text x="1235" y="342" text-anchor="middle" class="title">Model CI/CD</text>
  <text x="1235" y="362" text-anchor="middle" class="lbl-sm">PAI Model Gallery</text>
  <text x="1235" y="378" text-anchor="middle" class="lbl-sm">Qwen3-8B SFT + LoRA</text>
  <text x="1235" y="394" text-anchor="middle" class="lbl-sm">↓ eval harness</text>
  <text x="1235" y="410" text-anchor="middle" class="lbl-sm">(Qwen3.5-Plus judge)</text>
  <text x="1235" y="426" text-anchor="middle" class="lbl-sm">↓ gate: ≥95% teacher</text>
  <text x="1235" y="442" text-anchor="middle" class="lbl-sm">↓ PAI-EAS feature flag</text>
  <text x="1235" y="458" text-anchor="middle" class="lbl-sm">↓ 5% canary · 72 hr</text>
  <text x="1235" y="474" text-anchor="middle" class="lbl-sm">→ 100% ramp</text>
  <text x="1235" y="490" text-anchor="middle" class="lbl-sm">prior retained 30 days</text>

  <rect x="1140" y="520" width="190" height="240" class="box box-dr"/>
  <text x="1235" y="542" text-anchor="middle" class="title">DR + Rollback</text>
  <text x="1235" y="562" text-anchor="middle" class="lbl-sm">RPO ≤ 1 hr · RTO ≤ 4 hr</text>
  <text x="1235" y="580" text-anchor="middle" class="lbl-sm">Cross-AZ in SG</text>
  <text x="1235" y="600" text-anchor="middle" class="lbl-sm">Code rollback ~10 min</text>
  <text x="1235" y="616" text-anchor="middle" class="lbl-sm">Prompt rollback ~5 min</text>
  <text x="1235" y="632" text-anchor="middle" class="lbl-sm">Model rollback ~2 min</text>
  <text x="1235" y="648" text-anchor="middle" class="lbl-sm">Index re-ingest ~15 min</text>
  <text x="1235" y="664" text-anchor="middle" class="lbl-sm">Cache flush ~5 min</text>
  <text x="1235" y="684" text-anchor="middle" class="lbl-sm">Quarterly game-day</text>
  <text x="1235" y="700" text-anchor="middle" class="lbl-sm">Tokyo warm-standby</text>
  <text x="1235" y="716" text-anchor="middle" class="lbl-sm">on roadmap (PDPA</text>
  <text x="1235" y="732" text-anchor="middle" class="lbl-sm">transfer review req.)</text>

  <!-- ARROWS -->
  <!-- Hospital → Edge -->
  <path d="M240 150 L300 160" class="edge" marker-end="url(#arr)"/>
  <path d="M240 230 Q270 200 300 160" class="edge" marker-end="url(#arr)"/>
  <path d="M240 310 Q270 280 300 175" class="edge" marker-end="url(#arr)"/>
  <path d="M240 390 Q270 370 300 180" class="edge" marker-end="url(#arr)"/>
  <path d="M240 470 Q270 450 300 185" class="edge" marker-end="url(#arr)"/>

  <!-- Tier flow -->
  <path d="M690 190 L690 200" class="edge" marker-end="url(#arr)"/>
  <path d="M690 310 L690 320" class="edge" marker-end="url(#arr)"/>
  <path d="M690 430 L690 440" class="edge" marker-end="url(#arr)"/>
  <path d="M690 610 L690 620" class="edge" marker-end="url(#arr)"/>

  <!-- CI/CD → Production -->
  <path d="M1140 290 L1080 260" class="edge-cicd" marker-end="url(#arr-cicd)"/>
  <text x="1100" y="245" text-anchor="end" class="lbl-sm" fill="#16a34a">deploy</text>
  <path d="M1140 440 L1080 375" class="edge-cicd" marker-end="url(#arr-cicd)"/>

  <!-- DR callout -->
  <path d="M1140 610 L1080 580" class="edge-dr" marker-end="url(#arr)"/>
  <text x="1080" y="570" text-anchor="end" class="lbl-sm" fill="#dc2626">rollback path</text>

  <!-- Footer: SaaS-default + VPN optional -->
  <rect x="20" y="780" width="1340" height="70" class="group"/>
  <text x="40" y="802" class="title">Deployment principles (§9.1, §9.4, §7.6)</text>
  <text x="40" y="822" class="lbl-sm">• Mode 1 (SaaS default): public HTTPS + TLS 1.3 + IDaaS + WAF + optional IP allow-list — covers most hospitals with Internet-reachable FHIR/SharePoint</text>
  <text x="40" y="840" class="lbl-sm">• Mode 2 (opt-in): VPN Gateway IPsec-VPN for on-prem-only EHR/file shares · Smart Access Gateway turnkey alternative · no Apsara Stack/Express Connect in baseline · serverless by default · ACK only on contract</text>
</svg>
